<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>4orm Decision Card</title>
<meta name="description" content="The consumer side of 4ormIQ. Your decision, your risks, and what you did about them.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-css">
html,body{margin:0;background:#F5F6F9;height:100%}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;background-image:linear-gradient(90deg,#0B1530 0 244px,#F5F6F9 244px);font-family:Geist,Inter,system-ui,sans-serif;color:#0B1324;font-size:14px;-webkit-font-smoothing:antialiased;background:#F5F6F9}
.side{background:#0B1530;color:#C7D0E4;padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.ws{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);width:100%;border:0;text-align:left;cursor:pointer}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,#2E6BF2,#6A93F7);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6C7896;font-weight:600;padding:0 10px;margin-bottom:6px}
.nl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:500;color:#C7D0E4;width:100%;border:0;background:transparent;cursor:pointer;text-align:left}
.nl:hover{background:rgba(255,255,255,.05);color:#fff}
.nl.on{background:rgba(46,107,242,.2);color:#fff}
.ct{font-size:12px;color:#8C97B2;font-family:'Geist Mono',monospace}
.ct.r{background:#E0362C;color:#fff;border-radius:999px;padding:1px 7px;font-weight:600}
.ct.a{background:#D9910B;color:#fff;border-radius:999px;padding:1px 7px;font-weight:600}
.main{display:flex;flex-direction:column;min-width:0}
.hdr{display:flex;align-items:center;gap:16px;padding:14px 28px;background:#F5F6F9;position:sticky;top:0;z-index:5}
.title{font-size:15px;font-weight:600;white-space:nowrap}
.title span{color:#8A93A8;font-weight:500}
.search{flex:1;max-width:420px;display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(11,19,36,.06);color:#8A93A8;font-size:13px;margin-left:12px;border:0;cursor:text;text-align:left}
.kbd{font-family:'Geist Mono',monospace;font-size:11px;color:#6B7590;background:#F0F2F6;border-radius:5px;padding:2px 6px}
.body{padding:6px 28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-feature-settings:"tnum"}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;background:#2E6BF2;color:#fff;border:0;cursor:pointer;box-shadow:0 1px 2px rgba(46,107,242,.3),inset 0 1px 0 rgba(255,255,255,.18);white-space:nowrap}
.btn:hover{background:#2560E0}
.btn:disabled{background:#B9CDF9;box-shadow:none;cursor:default}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;background:#fff;color:#0B1324;border:0;cursor:pointer;box-shadow:0 1px 2px rgba(11,19,36,.08),0 0 0 1px rgba(11,19,36,.07);white-space:nowrap}
.btn2:hover{background:#F7F8FB}
.btn2:disabled{color:#9AA3B7;cursor:default}
.btn.red{background:#E0362C;box-shadow:0 1px 2px rgba(224,54,44,.3)}
.btn.dark{background:#0B1324;box-shadow:none}
.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(11,19,36,.04),0 6px 20px -10px rgba(11,19,36,.10);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 0}
.ct1{font-size:15px;font-weight:600;letter-spacing:-.005em}
.sub{font-size:12.5px;color:#6B7590}
.h1{font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kv{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.delta{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px}
.up,.dn{background:#E6F6EF;color:#137A50}.bad{background:#FDECEB;color:#B42318}.warn{background:#FFF4DE;color:#995C00}.neu{background:#EEF1F6;color:#4A5570}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;display:block}
.p-r{background:#FDECEB;color:#B42318}.p-r i{background:#E0362C}
.p-a{background:#FFF4DE;color:#995C00}.p-a i{background:#D9910B}
.p-g{background:#E6F6EF;color:#137A50}.p-g i{background:#1F9D6A}
.p-b{background:#EAF0FE;color:#1F4FBF}.p-b i{background:#2E6BF2}
.p-n{background:#EEF1F6;color:#4A5570}.p-n i{background:#8A93A8}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:#4A5570;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tab:hover{background:#EEF1F6}
.tab .c{font-size:11.5px;background:#EEF1F6;color:#4A5570;border-radius:6px;padding:1px 6px;font-family:'Geist Mono',monospace}
.tab.on{background:#0B1324;color:#fff}.tab.on .c{background:rgba(255,255,255,.16);color:#fff}
.seg{display:inline-flex;background:#E9ECF2;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-size:13px;font-weight:500;color:#4A5570;height:30px;padding:0 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:#0B1324;box-shadow:0 1px 2px rgba(11,19,36,.1)}
.fchip{border:0;height:30px;padding:0 11px;border-radius:8px;background:#fff;color:#4A5570;font-size:12.5px;font-weight:500;cursor:pointer;box-shadow:0 0 0 1px rgba(11,19,36,.08);display:inline-flex;align-items:center;gap:7px}
.fchip.on{background:#0B1324;color:#fff;box-shadow:none}
.th{display:grid;gap:14px;align-items:center;padding:0 20px;height:34px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#7A849C;background:#F8F9FB}
.tr{display:grid;gap:14px;align-items:center;padding:0 20px;min-height:56px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-size:14px;color:inherit}
.tr:nth-child(even){background:#FBFCFD}
.tr:hover{background:#F2F6FF}
.tr.sel{background:#EAF0FE}
.tr>*{min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px}
.chain i{height:14px;border-radius:3px;display:block}
.s{background:#2E6BF2}.x{background:#E0362C}.w{background:#F2B544}.o{background:#E6EAF1}
.stg{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px 12px;align-items:center}
.trk{grid-column:1 / -1;height:8px;border-radius:4px;background:#EEF1F6;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#7A849C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-r{background:#E0362C;box-shadow:0 0 0 3px rgba(224,54,44,.16)}.d-a{background:#D9910B;box-shadow:0 0 0 3px rgba(217,145,11,.16)}.d-g{background:#1F9D6A;box-shadow:0 0 0 3px rgba(31,157,106,.14)}.d-b{background:#2E6BF2}.d-n{background:#B5BCCB}.d-k{background:#B5BCCB}
.toggle{width:36px;height:20px;border-radius:999px;background:#2E6BF2;position:relative;flex:none;border:0;cursor:pointer;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:18px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle.off{background:#CBD2DF}.toggle.off::after{left:2px}
.toggle.lock{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.input{height:38px;border-radius:10px;background:#F5F6F9;padding:0 12px;display:flex;align-items:center;font-size:13.5px;color:#0B1324;border:0;width:100%;font-family:inherit;outline:none}
.input:focus{box-shadow:0 0 0 2px #2E6BF2}
textarea.input{height:auto;min-height:110px;padding:10px 12px;resize:vertical;line-height:1.5}
.banner{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#FDECEB,#FFF6F5)}
.banner.ok{background:linear-gradient(90deg,#E6F6EF,#F2FAF6)}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0B1324;color:#fff;font-size:11.5px;font-weight:500;white-space:nowrap;padding:5px 8px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .12s}
/* overview */
.files{grid-template-columns:96px minmax(0,1.7fr) minmax(0,1.1fr) 104px 168px 116px 64px}
.issues{grid-template-columns:84px minmax(0,2.2fr) 112px 56px 78px;gap:10px}
.agents{grid-template-columns:minmax(0,1.6fr) 48px minmax(0,1.1fr) 62px;gap:10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px;padding:0 2px;min-width:0}
.bar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative}
.bar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:#B9CDF9;min-height:3px;transition:background .15s}
.bar.last i{background:#2E6BF2}
.bar:hover i{background:#2E6BF2}
.bar:hover .tip{opacity:1}
.grid-y{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.grid-y span{font-size:11px;color:#9AA3B7;font-family:'Geist Mono',monospace}
.act{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:9px 0}
/* files */
.ftab{grid-template-columns:76px minmax(0,1.8fr) 96px 104px 128px 96px 58px;gap:10px}
.drawer{width:340px;flex:none;align-self:flex-start;position:sticky;top:70px}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.node{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Geist Mono',monospace}
.n-s{background:#2E6BF2;color:#fff}.n-x{background:#E0362C;color:#fff;box-shadow:0 0 0 4px rgba(224,54,44,.16)}.n-w{background:#FFF1D6;color:#995C00}.n-o{background:#EEF1F6;color:#9AA3B7}
/* evidence */
.fl{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;font-size:14px;color:inherit}
.fl:hover{background:#F2F4F8}
.fl.on{background:#EAF0FE}
.link{display:grid;grid-template-columns:34px minmax(0,1fr);gap:16px}
.rail{display:flex;flex-direction:column;align-items:center}
.enode{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12.5px;font-weight:600;flex:none}
.wire{width:2px;flex:1;min-height:12px;border-radius:2px}
.lk{border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff;box-shadow:0 0 0 1px rgba(11,19,36,.06)}
.lk.bad{background:#FFF7F6;box-shadow:0 0 0 1.5px rgba(224,54,44,.45)}
.lk.wait{background:#FFFBF2}
.lk.off{background:#FAFBFC;box-shadow:none}
.kvr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;font-size:13px;padding:6px 0}
.alog{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:8px 0;font-size:13px}
/* control map */
.map{position:relative;margin:0 auto}
.ln{position:absolute;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#2E6BF2;white-space:nowrap}
.nd{text-align:left;position:absolute;width:116px;height:74px;border-radius:12px;background:#fff;border:0;box-shadow:0 0 0 1.5px #DCE3EF,0 6px 14px -10px rgba(11,19,36,.3);padding:9px 10px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:box-shadow .15s,transform .15s;font-family:inherit}
.nd:hover{transform:translateY(-1px)}
.nd .t{font-size:11.5px;overflow-wrap:break-word;font-weight:600;line-height:1.22;color:#0B1324}
.nd .c{font-family:'Geist Mono',monospace;font-size:11px;color:#4A5570;padding-right:14px}
.nd .dot{position:absolute;bottom:12px;right:10px}
.nd.red{background:#FFF6F5;box-shadow:0 0 0 2px #E0362C,0 0 0 8px rgba(224,54,44,.1)}
.nd.amb{background:#FFFBF2;box-shadow:0 0 0 2px #E5A93A}
.nd.mine{background:#F3FBF7;box-shadow:0 0 0 1.5px #7CC4A3}
.nd.sel{box-shadow:0 0 0 2px #2E6BF2,0 0 0 7px rgba(46,107,242,.18)}
.nd.red.sel{box-shadow:0 0 0 2px #E0362C,0 0 0 7px rgba(46,107,242,.25)}
.h{position:absolute;height:2px;background:#AFC2E6}
.h::after{content:"";position:absolute;right:-1px;top:-4px;border-left:6px solid #AFC2E6;border-top:5px solid transparent;border-bottom:5px solid transparent}
.v{position:absolute;width:2px;background:#AFC2E6}
.v::after{content:"";position:absolute;bottom:-1px;left:-4px;border-top:6px solid #AFC2E6;border-left:5px solid transparent;border-right:5px solid transparent}
.mlog{grid-template-columns:56px 14px 84px minmax(0,1fr) 110px}
/* reports */
.ri{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;color:inherit;font-size:14px}
.ri:hover{background:#F2F4F8}
.ri.on{background:#EAF0FE}
.doc{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(11,19,36,.04),0 20px 50px -30px rgba(11,19,36,.35);padding:30px 34px}
.m{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:#F7F8FB}
.m .mval{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.vb{display:flex;align-items:flex-end;gap:6px;height:120px}
.vb div{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.vb i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:#B9CDF9;min-height:3px}
.vb i.last{background:#2E6BF2}
.rt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 0;font-size:13px}
.rt.hd{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#7A849C;padding-bottom:6px}
.sch{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr) 90px 90px}
/* ai */
.tool{grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 80px 70px 100px 90px}
.ev{display:grid;grid-template-columns:52px 10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;color:inherit;font-size:14px}
.ev:hover{background:#F2F4F8}
.ev.on{background:#EAF0FE}
.quote{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55}
.q-bad{background:#FFF6F5;box-shadow:inset 3px 0 0 #E0362C}
.q-good{background:#F2FAF6;box-shadow:inset 3px 0 0 #1F9D6A}
.gr{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:12px;align-items:center;padding:11px 0}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:stretch}
.fs{border-radius:12px;padding:12px;background:#F7F8FB;display:flex;flex-direction:column;gap:4px;position:relative}
.fs.hot{background:#0B1530;color:#fff}
/* agents */
.agc{padding:18px 20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s;border:0;text-align:left;font-family:inherit;color:inherit;font-size:14px;width:100%}
.agc.on{box-shadow:0 0 0 2px #2E6BF2,0 10px 30px -14px rgba(46,107,242,.45)}
.af{grid-template-columns:86px minmax(0,1.6fr) 120px 150px 100px}
.acc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;font-size:13px}
/* connections */
.cn{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.cnk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:12.5px}
.logo{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
/* settings */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{text-align:left;border:0;background:transparent;height:34px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:#4A5570;cursor:pointer}
.snav button.on{background:#fff;color:#0B1324;box-shadow:0 1px 2px rgba(11,19,36,.08)}
/* builder */
.libh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#7A849C;margin:6px 0 2px}
.li{text-align:left;font-size:13.5px;font-weight:600;min-height:42px;padding:6px 12px;border-radius:10px;border:1.5px solid #E1E7F1;background:#fff;color:#0B1324;width:100%;display:flex;align-items:center;gap:10px;cursor:grab;font-family:inherit}
.li.armed{border-color:#2E6BF2;background:#EEF3FE}
.li small{font-size:11.5px;font-weight:500;color:#6B7590;margin-left:auto}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.canvas{background-color:#fff;background-image:radial-gradient(#D3DCEB 1.2px,transparent 1.2px);background-size:22px 22px;border-radius:16px;min-width:0;box-shadow:0 1px 2px rgba(11,19,36,.04),0 6px 20px -10px rgba(11,19,36,.10)}
.bmap{position:relative}
.bnd{text-align:left;position:absolute;width:120px;height:86px;border-radius:14px;background:#fff;border:2px solid #DCE4F0;padding:8px 10px;display:flex;flex-direction:column;gap:3px;box-shadow:0 6px 16px -10px rgba(14,26,51,.25);cursor:pointer;font-family:inherit}
.bnd.mine{background:#F3FBF7;border-color:#7CC4A3}
.bnd.sel{box-shadow:0 0 0 4px rgba(46,107,242,.3);border-color:#2E6BF2}
.bnd.over{border-color:#2E6BF2;background:#EEF3FE}
.bnd .k{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bnd .t{font-size:12px;font-weight:700;line-height:1.22;overflow-wrap:break-word}
.bnd .p{font-family:'Geist Mono',monospace;font-size:9.5px;font-weight:600;background:#EEF2F8;border-radius:5px;padding:2px 5px;align-self:flex-start;margin-top:auto}
.slot{position:absolute;width:120px;height:86px;border-radius:14px;border:2px dashed #AFC2E6;background:rgba(255,255,255,.7);color:#2E6BF2;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.slot.hot,.slot.over{background:#EEF3FE;border-color:#2E6BF2}
.rm{font-size:13px;font-weight:700;border:0;background:#FDECEB;color:#B42318;border-radius:999px;min-height:36px;padding:0 14px;align-self:flex-start;cursor:pointer;font-family:inherit}
.kv2{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.4}
.say{background:#F4F6FA;border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.5}

.prev{font-size:13px;color:#6B7590;line-height:1.45}
.resp{font-size:17px;line-height:1.5;color:#33405C}
.q{font-size:21px;font-weight:600;line-height:1.35;letter-spacing:-.015em}

.trg{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;font-size:13.5px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;color:inherit}
.box{width:20px;height:20px;border-radius:6px;background:#fff;box-shadow:0 0 0 1.5px #CBD2DF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}

/* ---------- the maths, with the working shown ---------- */
const MQR_FLOOR = 5.25, MQR_BUFFER = 2;
const INSURED_MAX_PRICE = 1500000;
const money = (n) => '$' + Math.round(n).toLocaleString('en-CA');
const pct = (n) => (Math.round(n * 100) / 100) + '%';

function minDown(price) {
  if (price > INSURED_MAX_PRICE) return price * 0.20;
  if (price <= 500000) return price * 0.05;
  return 25000 + (price - 500000) * 0.10;
}
function premiumRate(ltv, amort) {
  let r = 0;
  if (ltv > 95) return null;
  else if (ltv > 90) r = 4.00;
  else if (ltv > 85) r = 3.10;
  else if (ltv > 80) r = 2.80;
  else return 0;
  if (amort > 25) r += 0.20;
  return r;
}
function monthlyPayment(principal, annualPct, years) {
  if (principal <= 0) return 0;
  const r = Math.pow(1 + (annualPct / 100) / 2, 1 / 6) - 1; // Canadian fixed, semi-annual compounding
  const n = years * 12;
  if (r === 0) return principal / n;
  return principal * r / (1 - Math.pow(1 + r, -n));
}
function pttOn(value) {
  let t = 0;
  t += Math.min(value, 200000) * 0.01;
  if (value > 200000) t += (Math.min(value, 2000000) - 200000) * 0.02;
  if (value > 2000000) t += (value - 2000000) * 0.03;
  if (value > 3000000) t += (value - 3000000) * 0.02; // further 2% on residential above $3M
  return t;
}
function pttFor(price, firstTime, newBuild) {
  const full = pttOn(price);
  let ex = 0, note = '', band = '';
  if (firstTime) {
    if (price <= 835000) { ex = pttOn(Math.min(price, 500000)); band = 'First time buyer, full exemption'; note = 'Exempt on the first ' + money(500000) + ' of the price.'; }
    else if (price < 860000) { const base = pttOn(500000); ex = base * (860000 - price) / 25000; band = 'First time buyer, partial'; note = 'The exemption tapers between ' + money(835000) + ' and ' + money(860000) + '.'; }
    else { band = 'Over the first time buyer limit'; note = 'The exemption ends at ' + money(860000) + '.'; }
  }
  if (newBuild) {
    let nex = 0, nband = '', nnote = '';
    if (price <= 1100000) { nex = full; nband = 'Newly built, full exemption'; nnote = 'No property transfer tax at all.'; }
    else if (price < 1150000) { nex = full * (1150000 - price) / 50000; nband = 'Newly built, partial'; nnote = 'The exemption tapers between ' + money(1100000) + ' and ' + money(1150000) + '.'; }
    else { nband = 'Over the newly built limit'; nnote = 'The exemption ends at ' + money(1150000) + '.'; }
    if (nex > ex) { ex = nex; band = nband; note = nnote; }
  }
  return { full, ex: Math.min(ex, full), net: Math.max(0, full - ex), band: band || 'No exemption claimed', note };
}
function runScenario(i) {
  const price = +i.price || 0, down = +i.down || 0, rate = +i.rate || 0, amort = +i.amort || 25;
  const income = +i.income || 0, debts = +i.debts || 0, tax = +i.tax || 0, heat = +i.heat || 100, strata = +i.strata || 0;
  const out = { steps: [], flags: [] };
  const req = minDown(price);
  out.minDown = req;
  out.downOk = down >= req - 0.5;
  const ltv = price ? (price - down) / price * 100 : 0;
  out.ltv = ltv;
  out.insurable = price <= INSURED_MAX_PRICE && ltv > 80;
  out.premiumRate = out.insurable ? premiumRate(ltv, amort) : 0;
  const base = Math.max(0, price - down);
  out.premium = out.insurable && out.premiumRate ? base * out.premiumRate / 100 : 0;
  out.loan = base + out.premium;
  out.payment = monthlyPayment(out.loan, rate, amort);
  out.mqr = Math.max(rate + MQR_BUFFER, MQR_FLOOR);
  out.stressPayment = monthlyPayment(out.loan, out.mqr, amort);
  const housing = out.stressPayment + tax / 12 + heat + strata * 0.5;
  out.gds = income ? housing / (income / 12) * 100 : 0;
  out.tds = income ? (housing + debts) / (income / 12) * 100 : 0;
  out.gdsLimit = 39; out.tdsLimit = 44;
  out.gdsOk = out.gds <= out.gdsLimit; out.tdsOk = out.tds <= out.tdsLimit;
  out.ptt = pttFor(price, i.firstTime, i.newBuild);
  out.amortOk = amort <= 25 || !out.insurable || i.firstTime || i.newBuild;
  out.closing = { ptt: out.ptt.net, legal: 1800, inspection: 600, appraisal: out.insurable ? 0 : 400, insurance: 150, moving: 1500 };
  out.closingTotal = Object.values(out.closing).reduce((a, b) => a + b, 0);
  out.cashNeeded = down + out.closingTotal;

  out.steps.push({ t: 'Minimum down payment', w: price > INSURED_MAX_PRICE ? '20% of ' + money(price) + ', because insurance is not available above ' + money(INSURED_MAX_PRICE) : price <= 500000 ? '5% of ' + money(price) : '5% of the first ' + money(500000) + ' plus 10% of the remaining ' + money(price - 500000), v: money(req) });
  out.steps.push({ t: 'Loan to value', w: '(' + money(price) + ' − ' + money(down) + ') ÷ ' + money(price), v: pct(ltv) });
  if (out.insurable) out.steps.push({ t: 'Insurance premium', w: pct(out.premiumRate) + ' of ' + money(base) + (amort > 25 ? ', including the 0.20% surcharge for an amortization over 25 years' : '') + '. It is added to the loan, so you pay interest on it for the whole amortization.', v: money(out.premium) });
  out.steps.push({ t: 'Payment at your rate', w: money(out.loan) + ' at ' + pct(rate) + ' over ' + amort + ' years, compounded semi-annually the way Canadian fixed mortgages are', v: money(out.payment) + ' a month' });
  out.steps.push({ t: 'The rate you must qualify at', w: 'The greater of ' + pct(rate) + ' plus ' + MQR_BUFFER + '% and the ' + MQR_FLOOR + '% floor', v: pct(out.mqr) });
  out.steps.push({ t: 'Payment they test you on', w: 'The same loan at ' + pct(out.mqr) + '. This is not the payment you make. It is the one you have to survive on paper.', v: money(out.stressPayment) + ' a month' });
  out.steps.push({ t: 'GDS, housing against income', w: '(' + money(out.stressPayment) + ' + ' + money(tax / 12) + ' tax + ' + money(heat) + ' heat' + (strata ? ' + half the ' + money(strata) + ' strata fee' : '') + ') ÷ ' + money(income / 12) + ' a month', v: pct(out.gds) + ' against a ' + out.gdsLimit + '% limit' });
  out.steps.push({ t: 'TDS, everything against income', w: 'GDS plus ' + money(debts) + ' of other monthly payments', v: pct(out.tds) + ' against a ' + out.tdsLimit + '% limit' });
  out.steps.push({ t: 'Property transfer tax', w: out.ptt.ex ? 'Full tax ' + money(out.ptt.full) + ' less an exemption of ' + money(out.ptt.ex) + '. ' + out.ptt.note : '1% on the first ' + money(200000) + ', 2% above that to ' + money(2000000) + ', 3% above that. ' + (out.ptt.note || ''), v: money(out.ptt.net) });
  out.steps.push({ t: 'Cash you need on closing day', w: money(down) + ' down plus about ' + money(out.closingTotal) + ' in closing costs', v: money(out.cashNeeded) });

  if (!out.downOk) out.flags.push({ k: 'r', t: 'Your down payment is below the minimum', s: 'You need at least ' + money(req) + ' on a ' + money(price) + ' home. You are ' + money(req - down) + ' short.' });
  if (price > INSURED_MAX_PRICE && down < price * 0.2) out.flags.push({ k: 'r', t: 'Insurance is not available above ' + money(INSURED_MAX_PRICE), s: 'Above that price, 20% down is the only way in.' });
  if (!out.gdsOk) out.flags.push({ k: 'r', t: 'Housing costs are over the GDS limit', s: pct(out.gds) + ' against a ' + out.gdsLimit + '% limit. A lender may still look at it, but it will be a conversation, not a formality.' });
  if (!out.tdsOk) out.flags.push({ k: 'r', t: 'Total debts are over the TDS limit', s: pct(out.tds) + ' against a ' + out.tdsLimit + '% limit. Paying down other debt moves this faster than a bigger down payment.' });
  if (out.gdsOk && out.tdsOk && out.downOk) out.flags.push({ k: 'g', t: 'This passes the arithmetic', s: 'On these numbers. It is not an approval, and no lender has looked at it.' });
  if (amort > 25 && out.insurable && !(i.firstTime || i.newBuild)) out.flags.push({ k: 'a', t: 'A 30 year amortization may not be available to you', s: 'With insurance, it is for first time buyers and buyers of new builds. Without insurance it is up to the lender.' });
  if (out.insurable && amort > 25) out.flags.push({ k: 'a', t: 'The longer amortization costs you', s: 'It lowers the payment, raises the total interest, and adds 0.20% to the insurance premium.' });
  if (ltv > 80 && ltv <= 81) out.flags.push({ k: 'a', t: 'You are just over 80%', s: 'A little more down and the insurance premium disappears entirely. Worth checking.' });
  if (i.firstTime && price > 835000 && price < 860000) out.flags.push({ k: 'a', t: 'You are in the taper', s: 'The first time buyer exemption shrinks between ' + money(835000) + ' and ' + money(860000) + ' and is gone above it.' });
  if (!i.firstTime && price <= 835000) out.flags.push({ k: 'b', t: 'Worth checking the first time buyer exemption', s: 'If nobody in your household has ever owned a principal residence anywhere, it is worth up to ' + money(8000) + ' at this price.' });
  if (!i.newBuild && price <= 1100000) out.flags.push({ k: 'b', t: 'If this is a new build, say so', s: 'A newly built home at this price is exempt from property transfer tax entirely. Different rule, different threshold.' });
  const diff = out.stressPayment - out.payment;
  if (diff > 0) out.flags.push({ k: 'b', t: 'The gap between the two payments is ' + money(diff) + ' a month', s: 'That is the buffer the test builds in. It is also a fair question to ask yourself: could you carry it?' });
  return out;
}

const LIB = [
  { id: 'l1', stage: 's6', tag: 'Rates', t: 'You can negotiate the rate you are offered', w: 'The first number is almost never the best one. In FCAC research published March 2026, 13% of mortgage holders did not know negotiating the rate or terms was even an option, and 20% did not compare lenders at all.', do: 'Ask directly: "Is that the best rate you can do for me?" Then ask the same of one other lender or a broker. The question costs nothing.', worth: 'A quarter point on $500,000 is roughly $65 a month and about $4,000 over a five year term.', src: 'fcacren' },
  { id: 'l2', stage: 's0', tag: 'Renewal', t: 'The renewal letter is an offer, not a price', w: 'Lenders know most people sign and send it back. Renewal is the one moment in the whole mortgage when leaving costs you almost nothing, which is exactly why the first offer is rarely their best.', do: 'Start 120 days out. Get one competing quote in writing, then take it back to your lender before you sign anything.', worth: 'Often the largest single saving available to anyone who already owns a home.', src: 'fcacren' },
  { id: 'l3', stage: 's0', tag: 'Penalties', t: 'Breaking a fixed mortgage is not three months interest', w: 'It is the greater of three months interest or the interest rate differential. FCAC\'s own worked example: $200,000 at 6% with 36 months left and a current posted rate of 4% gives about $3,000 three months interest and about $12,000 IRD. You pay the $12,000.', do: 'Before you commit to any plan that involves breaking, get the payout figure in writing, dated. Ask which of the two formulas applies and have them show the arithmetic.', worth: 'The difference between the two numbers is routinely four figures and sometimes five.', src: 'penalty' },
  { id: 'l4', stage: 's6', tag: 'Penalties', t: 'The discount you negotiated gets used against you in the penalty', w: 'Some lenders calculate the IRD using their posted rate when you signed, minus the discount you negotiated. A bigger discount then produces a bigger penalty. The rate you never paid ends up in the formula.', do: 'Ask one question before you sign: "Is the IRD calculated on my contract rate or on your posted rate?" Write the answer down.', worth: 'On the same balance, the two methods can differ by thousands.', src: 'penalty' },
  { id: 'l5', stage: 's6', tag: 'The contract', t: 'A collateral charge can quietly lock you in', w: 'A collateral charge is registered for more than you borrowed, so you can add to it later without re-registering. The part nobody mentions is the other direction: another lender usually cannot simply take it over at renewal, so switching means discharging and registering again, with legal costs.', do: 'Ask whether the mortgage is registered as a standard charge or a collateral charge, and what it would cost to switch at renewal.', worth: 'A few hundred to a couple of thousand in costs, and the loss of your best lever at renewal.', src: '' },
  { id: 'l6', stage: 's6', tag: 'The contract', t: 'Pre-approval is not approval', w: 'A pre-approval holds a rate, usually 90 to 120 days, and tells you roughly what you can borrow. The lender has still not approved the property, re-checked your income, or seen where the down payment came from.', do: 'Keep your subject to financing condition in the offer until the lender confirms in writing on that specific property. Do not change jobs or take on new debt in between.', worth: 'The difference between a firm offer you can keep and a deposit you can lose.', src: '' },
  { id: 'l7', stage: 's3', tag: 'Down payment', t: 'Your down payment has to have a history, not just a balance', w: 'Lenders and FINTRAC want ninety days of statements. A large deposit that appeared last week needs an explanation and a paper trail. This is the most common reason a file stalls in the last two weeks.', do: 'Move the money into one account ninety days before you plan to buy, and keep the paper for anything that is not pay.', worth: 'Weeks of delay, at the exact moment you cannot afford any.', src: 'fintrac' },
  { id: 'l8', stage: 's3', tag: 'Down payment', t: 'A gift needs the giver\'s bank confirmation, not just a letter', w: 'The gift letter says it is a gift and not a loan. Separately, the giver has to show the money was theirs. Most families are surprised by the second part and it arrives late.', do: 'Ask the person giving it to pull their statement at the same time they sign the letter.', worth: 'Days, and an awkward conversation at the worst time.', src: 'fintrac' },
  { id: 'l9', stage: 's7', tag: 'BC tax', t: 'The first time buyer exemption is worth up to $8,000, and you have to claim it', w: 'In BC, a first time buyer pays no property transfer tax on the first $500,000 if the home is $835,000 or less. Between $835,000 and $860,000 it tapers to nothing. Nobody claims it for you automatically.', do: 'Tell your lawyer or notary before closing. If you already closed and qualified, you can claim a refund from the first anniversary up to 18 months after registration.', worth: 'Up to $8,000.', src: 'fthb' },
  { id: 'l10', stage: 's7', tag: 'BC tax', t: 'A newly built home has a completely different threshold', w: 'The newly built home exemption wipes out the property transfer tax entirely up to $1,100,000, tapering to nothing at $1,150,000. It is a separate rule from the first time buyer one, with its own limit, and plenty of people qualify for it without knowing.', do: 'If the home has never been lived in, ask whether it qualifies. You do not have to be a first time buyer.', worth: 'Up to about $20,000 at the top of the range.', src: 'newbuild' },
  { id: 'l11', stage: 's2', tag: 'Qualifying', t: 'The rate you qualify at is not the rate you pay', w: 'You have to prove you could carry the payment at the greater of your rate plus two percent, or 5.25%. The payment you are approved on is therefore higher than the one you will actually make.', do: 'Ask for both numbers. Then ask yourself honestly whether the higher one is survivable, because that gap is the whole point of the test.', worth: 'Hundreds a month in the difference, and a realistic view of your own buffer.', src: 'mqr' },
  { id: 'l12', stage: 's3', tag: 'Down payment', t: 'Above $1.5 million there is no insurance, so 20% down is the only way in', w: 'Insurance is capped at a $1.5 million purchase price. Below that, the minimum is 5% of the first $500,000 and 10% of the rest. People often discover the cliff after they have fallen in love with a house.', do: 'If you are near $1.5 million, check both sides of the line before you look at anything.', worth: 'At $1.5 million the difference between a 10% and a 20% down payment is $150,000 in cash.', src: 'reforms' },
  { id: 'l13', stage: 's2', tag: 'Qualifying', t: 'The thirty year amortization is not for everyone', w: 'With mortgage insurance, thirty years is available to first time buyers and to anyone buying a new build. It lowers the payment, raises the total interest paid, and adds 0.20% to the insurance premium.', do: 'Ask for the payment and the total interest at both 25 and 30 years before choosing. See both numbers next to each other.', worth: 'Tens of thousands in interest over the life of the loan.', src: 'reforms' },
  { id: 'l14', stage: 's6', tag: 'Insurance', t: 'Mortgage insurance protects the lender, not you', w: 'The premium you pay when you put less than 20% down insures the lender against your default. It does nothing for your family. It is also added to your loan, so you pay interest on it for the whole amortization.', do: 'Do not confuse it with life or disability insurance on the mortgage, which is a separate product and a separate decision.', worth: 'Clarity about what you actually bought.', src: 'cmhc' },
  { id: 'l15', stage: 's6', tag: 'Your rights', t: 'You are owed the risks in writing before a mortgage is recommended', w: 'In BC, a broker has to assess whether a mortgage suits you and disclose material risks in writing before presenting it as an option. That includes renewals. A risk is material if it could reasonably change your decision.', do: 'If you were shown a product before you were shown the risks in writing, say so and ask for it. It is a rule, not a courtesy.', worth: 'The difference between a decision you made and one that was made around you.', src: 's70' },
  { id: 'l16', stage: 's6', tag: 'Your rights', t: 'Ask how your broker is paid, and how much', w: 'Brokers are usually paid by the lender, and the amount can differ between lenders. Most people never ask, and most disclosure says there is compensation without saying how much or whether it varies.', do: 'Ask two questions: who pays you, and does it change depending on which lender I choose.', worth: 'Knowing whether the recommendation in front of you is neutral.', src: 's70' },
  { id: 'l17', stage: 's6', tag: 'The contract', t: 'Cash back has a clawback', w: 'Cash back at signing is a loan dressed as a gift. Break or switch early and you usually repay all of it, not a pro-rated part.', do: 'If cash back is offered, ask what you repay if you leave in year two, and get the answer in writing.', worth: 'The full amount, exactly when you can least afford it.', src: '' },
  { id: 'l18', stage: 's0', tag: 'Moving', t: 'Porting has a deadline, and you keep the old rate only until the original maturity', w: 'Porting carries your rate to the new home, but lenders set a window between selling and buying, often 30 to 120 days. The old rate applies only to the original maturity date, and any new money is blended at today\'s rate.', do: 'If a move is possible in the next two years, ask whether your mortgage ports, what the window is, and how a blend is calculated, before you sign anything.', worth: 'A full penalty if the dates miss by a week.', src: '' },

const Store = {
  s: null, listeners: [],
  load() { try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const p = JSON.parse(raw); if (p && p.v === 1) { this.s = p; return; } } } catch (e) { } this.s = seedState(); },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.s)); } catch (e) { } },
  reset() { this.s = seedState(); this.save(); this.emit(); },
  emit() { this.listeners.forEach(fn => fn()); },
  commit() { this.save(); this.emit(); },
  stamp() { const m = NOW.m + 1 + this.s.clock; this.s.clock++; const hh = NOW.h + Math.floor(m / 60); return String(hh).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); },
  snapshot() { return JSON.stringify(this.s); },
  restore(snap) { this.s = JSON.parse(snap); this.commit(); }
};

const D = {
  risk(id) { return Store.s.risks.find(r => r.id === id); },
  before(r) { return r.L * r.S; },
  after(r) { return r.prot.length ? r.L2 * r.S2 : r.L * r.S; },
  protected(r) { return r.prot.length > 0; },
  sorted() { return Store.s.risks.slice().sort((a, b) => this.after(b) - this.after(a) || this.before(b) - this.before(a)); },
  top() { return Math.max(...Store.s.risks.map(r => this.after(r)), 0); },
  topBefore() { return Math.max(...Store.s.risks.map(r => this.before(r)), 0); },
  stops() { return Store.s.risks.filter(r => this.after(r) >= 16); },
  needOwner() { return Store.s.risks.filter(r => { const a = this.after(r); return a >= 10 && a <= 15; }); },
  missingOwner() { return this.needOwner().filter(r => !r.owner || !r.by); },
  readinessFrom(fn) {
    const rs = Store.s.risks; if (!rs.length) return 10;
    const avg = rs.reduce((t, r) => t + fn(r), 0) / rs.length;
    const ext = rs.filter(r => fn(r) >= 16).length, hi = rs.filter(r => fn(r) >= 10 && fn(r) <= 15).length;
    return Math.max(1, Math.min(10, Math.round(10 * (1 - avg / 25) - 1.5 * ext - 0.5 * hi)));
  },
  readiness() { return this.readinessFrom(r => this.after(r)); },
  readinessBefore() { return this.readinessFrom(r => this.before(r)); },
  cellRisks(L, S, after) { return Store.s.risks.filter(r => after ? (this.protected(r) ? r.L2 === L && r.S2 === S : r.L === L && r.S === S) : r.L === L && r.S === S); },
  done() {
    const s = Store.s;
    return [
      { k: 'pre', name: 'Pre-check', ok: s.pre.every(p => p.a), sub: s.pre.filter(p => p.a).length + ' of ' + s.pre.length + ' answered' },
      { k: 'steps', name: 'Steps', ok: s.steps.length > 0, sub: s.steps.length + ' steps' },
      { k: 'risks', name: 'Risks', ok: s.risks.length > 0, sub: s.risks.length + ' ranked' },
      { k: 'prot', name: 'Protection', ok: s.risks.every(r => this.protected(r)), sub: s.risks.filter(r => this.protected(r)).length + ' of ' + s.risks.length + ' covered' },
      { k: 'long', name: 'Long-term risk', ok: this.stops().length === 0 && this.missingOwner().length === 0, sub: this.stops().length ? this.stops().length + ' stop point' + (this.stops().length > 1 ? 's' : '') : this.missingOwner().length ? this.missingOwner().length + ' need a name and a date' : 'clear' },
      { k: 'sign', name: 'Sign-off', ok: s.sign.me && (!s.me.joint || s.sign.co), sub: s.sign.me && s.sign.co ? 'both signed' : s.sign.me ? 'waiting on ' + s.me.co.split(' ')[0] : 'not signed' }
    ];
  },
  canSign() { return this.stops().length === 0 && this.missingOwner().length === 0 && Store.s.risks.every(r => this.protected(r)); },
  tagged(t) { return Store.s.facts.filter(f => f.tag === t).length; }
};

const A = {
  log(a, d) { Store.s.log.unshift({ t: Store.stamp(), a, d }); if (Store.s.log.length > 14) Store.s.log.pop(); },
  pre(id, a) { const p = Store.s.pre.find(x => x.id === id); if (!p) return; p.a = a; A.log('Pre-check updated.', p.q); Store.commit(); },
  score(id, which, n) {
    const r = D.risk(id); if (!r) return;
    if (which === 'L') { r.L = n; if (!r.prot.length) r.L2 = n; }
    if (which === 'S') { r.S = n; if (!r.prot.length) r.S2 = n; }
    if (which === 'L2') r.L2 = Math.min(n, r.L);
    if (which === 'S2') r.S2 = Math.min(n, r.S);
    A.log('Risk re-scored.', r.what); Store.commit();
  },
  addProt(id, k, t, owner, by) {
    const r = D.risk(id); if (!r) return;
    r.prot.push({ k, t, owner: owner || '', by: by || '' });
    const o = ORDER.findIndex(x => x.k === k);
    if (o <= 1) { r.L2 = Math.max(1, r.L2 - 2); r.S2 = Math.max(1, r.S2 - 1); }
    else if (o === 2) { r.L2 = Math.max(1, r.L2 - 1); r.S2 = Math.max(1, r.S2 - 1); }
    else { r.L2 = Math.max(1, r.L2 - 1); }
    if (owner) r.owner = owner; if (by) r.by = by;
    A.log('Protection added.', t); Store.commit();
  },
  removeProt(id, i) { const r = D.risk(id); if (!r) return; const p = r.prot.splice(i, 1)[0]; if (!r.prot.length) { r.L2 = r.L; r.S2 = r.S; } A.log('Protection removed.', p ? p.t : ''); Store.commit(); },
  owner(id, owner, by) { const r = D.risk(id); if (!r) return; r.owner = owner; r.by = by; A.log('Owner and date set.', r.what); Store.commit(); },
  addRisk(step, what, L, S) {
    const id = 'r' + (Store.s.risks.length + 1) + Date.now().toString().slice(-3);
    Store.s.risks.push({ id, step: step || 1, what, L: L || 3, S: S || 3, L2: L || 3, S2: S || 3, prot: [], owner: '', by: '', note: '' });
    A.log('Risk added.', what); Store.commit(); return id;
  },
  note(id, t) { const r = D.risk(id); if (!r) return; r.note = t; Store.commit(); },
  addStep(t) { Store.s.steps.push({ n: Store.s.steps.length + 1, t }); A.log('Step added.', t); Store.commit(); },
  connectBank() {
    const s = Store.s; s.bank.connected = true;
    const up = { f1: '$7,386 a month', f2: '$4,153 a month', f3: '$412,480', f5: '$1,946 a month', f6: '$2,874 a month', f7: '2.1 months' };
    s.facts.forEach(f => { if (up[f.id]) { f.v = up[f.id]; f.tag = 'confirmed'; f.src = 'Confirmed from your bank data, with your consent'; } });
    A.log('Bank connected.', 'Six facts went from what you said to confirmed. Nothing was shared with anyone.');
    Store.commit();
  },
  disconnectBank() { const s = Store.s; s.bank.connected = false; s.facts.forEach(f => { if (f.tag === 'confirmed') { f.tag = 'stated'; f.src = 'You said it'; } }); A.log('Bank disconnected.', 'Confirmed facts went back to what you said.'); Store.commit(); },
  layer(n) { const l = Store.s.layers.find(x => x.n === n); if (!l) return; l.on = !l.on; A.log(l.on ? 'Access given.' : 'Access withdrawn.', l.name); Store.commit(); },
  unshare() { Store.s.shared.link = false; Store.s.layers.forEach(l => l.on = false); A.log('Sharing stopped.', 'No professional can open your card. Anything already shared or lawfully kept may not be recoverable.'); Store.commit(); },
  reshare(who, agent) { Store.s.shared = { with: who, agent: agent || '', at: 'just now', link: true }; Store.s.layers[0].on = true; Store.s.layers[1].on = true; A.log('Card shared.', who); Store.commit(); },
  sign(who) {
    const s = Store.s;
    if (who === 'me') s.sign.me = !s.sign.me; else s.sign.co = !s.sign.co;
    if (s.sign.me && s.sign.co) s.sign.pro = 'Waiting on Marcus Leduc';
    else s.sign.pro = 'Not yet';
    A.log(who === 'me' ? (s.sign.me ? 'You signed.' : 'You unsigned.') : (s.sign.co ? s.me.co.split(' ')[0] + ' signed.' : s.me.co.split(' ')[0] + ' unsigned.'), 'Sign-off');
    Store.commit();
  },
  trigger(id) { const t = Store.s.triggers.find(x => x.id === id); if (!t) return; t.on = !t.on; Store.commit(); },
  doc(id, status) { const d = Store.s.docs.find(x => x.id === id); if (!d) return; d.status = status; A.log(status === 'todo' ? 'Document unticked.' : status === 'sent' ? 'Document sent.' : 'Document gathered.', d.n); Store.commit(); },
  docStageAll(k) { const ds = Store.s.docs.filter(d => d.stage === k && !d.opt); const allGot = ds.every(d => d.status !== 'todo'); ds.forEach(d => d.status = allGot ? 'todo' : 'got'); A.log(allGot ? 'Stage cleared.' : 'Stage marked gathered.', STAGES.find(x => x.k === k).n); Store.commit(); },
  sc(k, v) { const n = String(v).replace(/[^0-9.]/g, ''); Store.s.sc[k] = n === '' ? 0 : +n; Store.commit(); },
  scToggle(k) { Store.s.sc[k] = !Store.s.sc[k]; Store.commit(); },
  scReset() { Store.s.sc = seedState().sc; Store.commit(); },
  scSave() { const r = runScenario(Store.s.sc); A.log('Scenario saved to your record.', money(Store.s.sc.price) + ' at ' + Store.s.sc.rate + '%, payment ' + money(r.payment) + ', tested at ' + money(r.stressPayment) + '.'); Store.commit(); },
  chatAnswer(text) { const c = Store.s.chat; c.answers.push(text); c.i++; Store.commit(); },
  chatBack() { const c = Store.s.chat; if (c.i > 0) { c.i--; c.answers.pop(); Store.commit(); } },
  chatReset() { Store.s.chat = { i: 0, answers: [] }; Store.commit(); }
};

/* ---------- heat map ---------- */
function heatmap(opts) {
  opts = opts || {};
  const after = U.hmAfter;
  let out = '<div class="hm"><div class="cnr"></div>';
  SEVERE.forEach(sv => { out += `<div class="cx"><div>${sv.n} ${h(sv.k)}</div><div style="font-weight:500;color:#8A93A8">${h(sv.s)}</div></div>`; });
  LIKELY.slice().reverse().forEach(lk => {
    out += `<div class="cy"><div>${lk.n} ${h(lk.k)}</div><div style="font-weight:500;color:#8A93A8">${h(lk.s)}</div></div>`;
    SEVERE.forEach(sv => {
      const sc = lk.n * sv.n, b = band(sc), key = lk.n + ':' + sv.n;
      const here = D.cellRisks(lk.n, sv.n, after);
      const moved = after ? Store.s.risks.filter(r => D.protected(r) && r.L === lk.n && r.S === sv.n && (r.L2 !== r.L || r.S2 !== r.S)) : [];
      out += `<button class="cell ${b.cell}${U.hmCell === key ? ' on' : ''}" data-a="hm.cell" data-v="${key}" title="${lk.k} × ${sv.k} = ${sc}"><span class="sc">${sc}</span>${here.map(r => `<span class="pip${after && D.protected(r) ? ' after' : ''}">${Store.s.risks.indexOf(r) + 1}</span>`).join('')}${moved.map(() => `<span style="width:8px;height:8px;border-radius:50%;background:rgba(11,19,36,.18);display:block"></span>`).join('')}</button>`;
    });
  });

/* ---------- Sign-off ---------- */
function vSign() {
  const s = Store.s, can = D.canSign(), done = D.done();
  const blockers = [];
  if (!s.risks.every(r => D.protected(r))) blockers.push(s.risks.filter(r => !D.protected(r)).length + ' risk' + (s.risks.filter(r => !D.protected(r)).length > 1 ? 's have' : ' has') + ' nothing in place');
  if (D.stops().length) blockers.push(D.stops().length + ' risk' + (D.stops().length > 1 ? 's are' : ' is') + ' still 16 or over');
  if (D.missingOwner().length) blockers.push(D.missingOwner().length + ' risk' + (D.missingOwner().length > 1 ? 's need' : ' needs') + ' a name and a date');

let toastWrap;
function toast(msg, opts) {
  opts = opts || {};
  if (!toastWrap) { toastWrap = document.createElement('div'); toastWrap.className = 'toasts'; document.body.appendChild(toastWrap); }
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${h(msg)}</span>${opts.undo ? '<button data-t="undo">Undo</button>' : ''}<button data-t="x">Dismiss</button>`;
  el.querySelector('[data-t="x"]').onclick = () => el.remove();
  if (opts.undo) el.querySelector('[data-t="undo"]').onclick = () => { opts.undo(); el.remove(); };
  toastWrap.appendChild(el); setTimeout(() => el.remove(), opts.ms || 5200);
}
function withUndo(label, fn) { const snap = Store.snapshot(); fn(); toast(label, { undo: () => { Store.restore(snap); toast('Put back.'); } }); }

let modalEl = null;
function modal(o) {
  closeModal();
  modalEl = document.createElement('div'); modalEl.className = 'ovl';
  modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="mh"><div><div style="font-size:18px;font-weight:600;letter-spacing:-.015em">${h(o.title)}</div>${o.sub ? `<div class="sub" style="margin-top:4px">${h(o.sub)}</div>` : ''}</div><button class="btn2 sm" data-m="close">Close</button></div><div class="mb">${o.body || ''}</div><div class="mf">${(o.actions || []).map((a, i) => `<button class="${a.cls || (i === 0 ? 'btn' : 'btn2')}" data-m="act" data-i="${i}">${h(a.label)}</button>`).join('')}</div></div>`;
  document.body.appendChild(modalEl);
  modalEl.addEventListener('click', (e) => {
    if (e.target === modalEl || e.target.closest('[data-m="close"]')) return closeModal();
    const pick = e.target.closest('[data-pick]');
    if (pick) { modalEl.querySelectorAll('[data-pick]').forEach(x => x.classList.remove('on')); pick.classList.add('on'); const inp = modalEl.querySelector('input[data-fx="t"]'); if (inp && pick.dataset.text && !inp.value.trim()) inp.value = pick.dataset.text; return; }
    const b = e.target.closest('[data-m="act"]'); if (b) { const a = o.actions[+b.dataset.i]; const r = a.run ? a.run(modalEl) : true; if (r !== false) closeModal(); }
  });
  const f = modalEl.querySelector('input,textarea'); if (f) f.focus();
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
const val = (s) => { const e = modalEl && modalEl.querySelector(s); return e ? e.value.trim() : ''; };
const picked = () => { const e = modalEl && modalEl.querySelector('[data-pick].on'); return e ? e.dataset.pick : null; };

let dlCap;
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain' });
  const direct = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  if (dlCap === undefined && window.claude && window.claude.use) dlCap = claude.use('downloads').catch(() => null);
  if (dlCap && dlCap.then) { dlCap.then(d => { if (d && d.save) d.save({ filename: name, data: text }).catch(() => toast('Download declined.')); else direct(); }); return; }
  direct();
}

  const s = Store.s;
  const rows = D.sorted().map(r => `<tr><td>${s.risks.indexOf(r) + 1}</td><td>${h(r.what)}</td><td>${r.L}×${r.S}=${D.before(r)}</td><td>${r.prot.map(p => h(p.t)).join('; ') || '—'}</td><td>${r.L2}×${r.S2}=${D.after(r)}</td><td>${h(band(D.after(r)).name)}</td><td>${h(r.owner || '—')}${r.by ? ' · ' + h(r.by) : ''}</td></tr>`).join('');
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${h(s.card.id)} decision card</title><style>body{font-family:system-ui,sans-serif;color:#0B1324;padding:28px;line-height:1.5}h1{font-size:24px;letter-spacing:-.02em;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:#7A849C;padding:6px 8px;background:#F8F9FB}td{padding:8px;vertical-align:top}tr:nth-child(even) td{background:#FBFCFD}.k{color:#6B7590;font-size:12.5px}</style></head><body><h1>${h(s.card.decision)}</h1><div class="k">${h(s.card.id)} · ${h(s.me.name)}${s.me.joint ? ' and ' + h(s.me.co) : ''} · opened ${h(s.card.opened)} · ${h(s.card.valid)}</div><p>"${h(s.card.quote)}"</p><p class="k">Top risk ${D.topBefore()} before protection, ${D.top()} after. Readiness ${D.readinessBefore()} to ${D.readiness()} out of 10. ${D.stops().length} stop point(s). Signed: ${s.sign.me ? 'yes' : 'no'}${s.me.joint ? ', co-borrower ' + (s.sign.co ? 'yes' : 'no') : ''}.</p><table><thead><tr><th>#</th><th>What could go wrong</th><th>Before</th><th>Protection</th><th>After</th><th>Band</th><th>Owner</th></tr></thead><tbody>${rows}</tbody></table><p class="k">Re-do this card when: ${s.triggers.filter(t => t.on).map(t => h(t.t)).join(', ')}.</p><script>setTimeout(function(){window.print()},500)<\/script></body></html>`);
  w.document.close();
}

/* modals */
function protModal(id) {
  const r = D.risk(id); if (!r) return;
  const SUG = { remove: 'Take this step out of the plan', swap: 'Change the plan so this cannot bite', safeguard: 'Put money or a condition in place that catches it', check: 'Get the real figure in writing, dated', plan: 'Agree now what we do if it happens anyway' };
  modal({
    title: 'Add protection', sub: r.what,
    body: `<div class="sub">Work down the list. Only use the last one when the ones above it will not work.</div>
    ${ORDER.map(o => `<button class="po" data-pick="${o.k}" data-text="${h(SUG[o.k])}"><span class="o">${o.n}</span><div><div style="font-weight:600">${h(o.name)}</div><div class="sub">${h(o.s)}</div></div></button>`).join('')}
    <label class="field"><span class="sub">What exactly will be done</span><input class="input" data-fx="t" placeholder="Say it the way you would say it out loud"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field"><span class="sub">Who is doing it</span><input class="input" data-fx="o" value="${h(Store.s.me.name.split(' ')[0])}"></label><label class="field"><span class="sub">By when</span><input class="input" data-fx="b" placeholder="e.g. 10 Nov"></label></div>`,
    actions: [{ label: 'Add it', run: () => { const k = picked(); if (!k) { toast('Pick which kind of protection it is.'); return false; } const t = val('[data-fx="t"]'); if (!t) { toast('Say what will be done.'); return false; } withUndo('Protection added. Score it again to see where it lands.', () => A.addProt(id, k, t, val('[data-fx="o"]'), val('[data-fx="b"]'))); U.rSel = id; return true; } }, { label: 'Cancel' }]
  });
}
function ownerModal(id) {
  const r = D.risk(id); if (!r) return;
  modal({ title: 'Who owns it, and by when', sub: r.what + ' · sitting at ' + D.after(r) + ', which needs a name and a date',
    body: `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field"><span class="sub">Who</span><input class="input" data-fx="o" value="${h(r.owner)}" placeholder="A name, not a role"></label><label class="field"><span class="sub">By when</span><input class="input" data-fx="b" value="${h(r.by)}" placeholder="e.g. 10 Nov"></label></div><div class="sub">A worksite card will not close without both. Neither will this one.</div>`,
    actions: [{ label: 'Save', run: () => { const o = val('[data-fx="o"]'), b = val('[data-fx="b"]'); if (!o || !b) { toast('Both a name and a date.'); return false; } A.owner(id, o, b); toast('Saved. ' + o + ' owns it by ' + b + '.'); return true; } }, { label: 'Cancel' }] });
}
function riskModal() {
  modal({ title: 'Add a risk', sub: 'What could go wrong, in your words',
    body: `<label class="field"><span class="sub">Which step</span><div class="scale">${Store.s.steps.map(st => `<button class="sb" data-pick="${st.n}"><span class="k">${st.n}</span><span class="l">${h(st.t)}</span></button>`).join('')}</div></label>
    <label class="field"><span class="sub">What could go wrong</span><input class="input" data-fx="t" placeholder="Start with what actually happens, not how it feels"></label>
    <div class="sub">You will score it on the next screen. Nobody scores it for you.</div>`,
    actions: [{ label: 'Add it', run: () => { const t = val('[data-fx="t"]'); if (!t) { toast('Say what could go wrong.'); return false; } const id = A.addRisk(+(picked() || 1), t, 3, 3); U.rSel = id; go('risks'); toast('Added. Now score it: how likely, and how much it would hurt.'); return true; } }, { label: 'Cancel' }] });
}
function stepModal() {
  modal({ title: 'Add a step', sub: 'Each step starts with something you do', body: `<label class="field"><span class="sub">The step</span><input class="input" data-fx="t" placeholder="e.g. Hand in notice on the rental"></label>`,
    actions: [{ label: 'Add it', run: () => { const t = val('[data-fx="t"]'); if (!t) return false; A.addStep(t); toast('Step added.'); return true; } }, { label: 'Cancel' }] });
}
function noteModal(id) {
  const r = D.risk(id); if (!r) return;
  modal({ title: 'Your note', sub: r.what, body: `<textarea class="input" data-fx="t" placeholder="Anything you want on the record in your own words">${h(r.note)}</textarea>`,
    actions: [{ label: 'Save', run: () => { A.note(id, val('[data-fx="t"]')); toast('Saved to your card.'); return true; } }, { label: 'Cancel' }] });
}
function bankModal() {
  modal({ title: 'What happens if you connect your bank', sub: 'Plainly, with nothing left out',
    body: `<div style="display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.55">
    <div><b style="font-weight:600">What it reads.</b> Money coming in and what type it is, your regular bills, loan payments, and whether anything bounced in the last year.</div>
    <div><b style="font-weight:600">What it never does.</b> It cannot move money. It is read-only.</div>
    <div><b style="font-weight:600">What your professional sees.</b> That your income was checked and when. Not your statements, not your transactions. We call that verified, not exposed.</div>
    <div><b style="font-weight:600">What a lender gets.</b> Nothing from here. Your file goes to a lender only when you pick one, for that application, with your approval.</div>
    <div><b style="font-weight:600">How long.</b> Twelve months, then it stops on its own. You can stop it sooner from this page at any time.</div>
    <div class="sub">Connecting upgrades six of your figures from what you said to confirmed. Your card shows both, and when each one arrived.</div></div>`,
    actions: Store.s.bank.connected ? [{ label: 'Done' }] : [{ label: 'Connect my bank', run: () => { withUndo('Bank connected. Six figures are now confirmed.', () => A.connectBank()); return true; } }, { label: 'Not now' }] });
}
function shareModal() {
  modal({ title: 'Share your card', sub: 'You send the link. 4ormIQ never contacts anyone for you.',
    body: `<label class="field"><span class="sub">Who are you sending it to</span><input class="input" data-fx="w" placeholder="The firm or the person"></label><label class="field"><span class="sub">Their name, if you have it</span><input class="input" data-fx="a" placeholder="Optional"></label>
    <div class="sub">They will see layers 1 and 2. Your full file stays sealed until you pick a lender.</div>`,
    actions: [{ label: 'Create the link', run: () => { const w = val('[data-fx="w"]'); if (!w) { toast('Who is it going to?'); return false; } A.reshare(w, val('[data-fx="a"]')); toast('Link ready. Nothing happens until you send it.'); return true; } }, { label: 'Cancel' }] });
}
function previewModal() {
  const s = Store.s;
  modal({ title: 'What ' + (s.shared.agent || 'they') + ' sees', sub: 'Exactly this, nothing more',
    body: `<div style="display:flex;flex-direction:column;gap:9px;font-size:13.5px">${[['Your decision and your five steps', true], ['Every risk, scored before and after', true], ['What you put in place, who owns it, by when', true], ['Identity checked ' + (s.bank.connected ? 'and income confirmed' : ''), true], ['Your bank statements', false], ['Your transactions', false], ['Your full lender file', false]].map(([t, y]) => `<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span>${h(t)}</span><span class="pill ${y ? 'p-g' : 'p-n'}"><i></i>${y ? 'Yes' : 'No'}</span></div>`).join('')}</div>`,
    actions: [{ label: 'Done' }] });
}
function pauseModal() {
  modal({ title: 'Paused. Nothing is lost.', sub: 'Everything you have done stays exactly where it is.',
    body: `<div style="font-size:14px;line-height:1.55">Come back whenever you want, from any device. Your card will be where you left it, and so will your place in the conversation.<div class="sub" style="margin-top:10px">There is no clock on this, and nothing expires except your bank consent, which runs out on its own after twelve months.</div></div>`,
    actions: [{ label: 'Keep going' }, { label: 'Download my card', cls: 'btn2', run: () => { download('my-decision-card.json', cardJSON(), 'application/json'); toast('Downloaded.'); return true; } }] });
}
function ownModal() {
  modal({ title: 'Say it your way', sub: 'However you would put it out loud', body: `<textarea class="input" data-fx="t" placeholder="Type it here"></textarea>`,
    actions: [{ label: 'That is it', run: () => { const t = val('[data-fx="t"]'); if (!t) return false; A.chatAnswer(t); return true; } }, { label: 'Cancel' }] });
}

/* events */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const a = el.dataset.a, id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case 'nav': go(v); break;
    case 'pause': pauseModal(); break;
    case 'print': toast('Opening the print view. Choose Save as PDF if you want a copy.'); printCard(); break;
    case 'export': download('my-decision-card.json', cardJSON(), 'application/json'); toast('Your whole card, downloaded.'); break;
    /* card */
    case 'pre': A.pre(id, v); break;
    case 'step.add': stepModal(); break;
    case 'step.open': { U.hmCell = null; go('risks'); const first = Store.s.risks.find(r => r.step === +v); if (first) { U.rSel = first.id; render(); toast('Showing the risks on step ' + v + '.'); } else toast('No risks on that step yet. Add one.'); break; }
    /* risks */
    case 'risk.sel': U.rSel = id; render(); break;
    case 'risk.open': U.rSel = id; go('risks'); break;
    case 'risk.add': riskModal(); break;
    case 'risk.score': A.score(id, el.dataset.w, +v); break;
    case 'risk.owner': ownerModal(id); break;
    case 'risk.note': noteModal(id); break;
    case 'hm.when': U.hmAfter = v === '1'; U.hmCell = null; render(); break;
    case 'hm.cell': U.hmCell = U.hmCell === v ? null : v; render(); break;
    /* protection */
    case 'p.tab': U.pTab = v; render(); break;
    case 'prot.add': protModal(id); break;
    case 'prot.remove': withUndo('Protection removed.', () => A.removeProt(id, +el.dataset.i)); break;
    /* money */
    case 'f.tab': U.fTab = v; render(); break;
    case 'bank.on': bankModal(); break;
    case 'bank.off': withUndo('Disconnected. Those figures went back to what you said.', () => A.disconnectBank()); break;
    case 'bank.what': bankModal(); break;
    /* who */
    case 'layer': { const l = Store.s.layers.find(x => x.n === +v); withUndo(l.on ? 'Layer ' + v + ' switched off.' : 'Layer ' + v + ' switched on.', () => A.layer(+v)); break; }
    case 'who.share': shareModal(); break;
    case 'who.preview': previewModal(); break;
    case 'who.stop': modal({ title: 'Stop sharing with everyone?', sub: 'All three layers go off and the link stops working.', body: `<div style="font-size:14px;line-height:1.55">Being straight with you: anything already shared, or that they have to keep by law, may not be recoverable. Switching off stops anything new.</div>`, actions: [{ label: 'Stop sharing', cls: 'btn red', run: () => { withUndo('Sharing stopped. Nobody can open your card.', () => A.unshare()); return true; } }, { label: 'Cancel' }] }); break;
    /* sign */
    case 'sign': { const s = Store.s; const was = v === 'me' ? s.sign.me : s.sign.co; if (!was && !D.canSign()) { modal({ title: 'Sign with things still open?', sub: 'You can. The card will show what was outstanding at the moment you signed.', body: `<div style="font-size:14px;line-height:1.55">${D.stops().length ? D.stops().length + ' risk still sits at 16 or over. ' : ''}${D.missingOwner().length ? D.missingOwner().length + ' risk needs a name and a date. ' : ''}${Store.s.risks.some(r => !D.protected(r)) ? 'Some risks have nothing in place yet.' : ''}</div>`, actions: [{ label: 'Sign anyway', run: () => { A.sign(v); toast('Signed, with what was outstanding noted on the card.'); return true; } }, { label: 'Go back and fix it', cls: 'btn2', run: () => { go('long'); return true; } }] }); break; } A.sign(v); toast(was ? 'Signature removed.' : v === 'me' ? 'Signed. Your card is sealed and time-stamped.' : Store.s.me.co.split(' ')[0] + ' signed on their own phone.'); break; }
    case 'trigger': A.trigger(id); break;
    /* documents */
    case 'd.stage': U.dStage = v; U.dSel = null; render(); break;
    case 'd.sel': U.dSel = U.dSel === id ? null : id; render(); break;
    case 'd.opt': U.dOpt = !U.dOpt; render(); break;
    case 'd.got': { const d = Store.s.docs.find(x => x.id === id); A.doc(id, d.status === 'todo' ? 'got' : 'todo'); break; }
    case 'd.sent': { const d = Store.s.docs.find(x => x.id === id); A.doc(id, d.status === 'sent' ? 'got' : 'sent'); break; }
    case 'd.stage.all': withUndo('Stage updated.', () => A.docStageAll(v)); break;
    case 'd.print': printDocs(); toast('Opening the checklist to print.'); break;
    case 'd.risk': { const d = Store.s.docs.find(x => x.id === id); const rid = A.addRisk(1, 'We cannot get: ' + d.n, 3, 3); U.rSel = rid; go('risks'); toast('Added as a risk. Score it: how likely, and how much it would hurt.'); break; }
    /* scenario */
    case 'sc.toggle': A.scToggle(v); break;
    case 'sc.reset': A.scReset(); toast('Back to the example numbers.'); break;
    case 'sc.save': A.scSave(); toast('Saved to your record, with the working.'); break;
    case 'sc.torisk': { const r = runScenario(Store.s.sc); const bad = r.flags.filter(f => f.k === 'r' || f.k === 'a'); if (!bad.length) { toast('Nothing here is flagging. Change a number and try again.'); break; } modal({ title: 'Turn a flag into a risk', sub: 'It goes on your card where you score it yourself', body: bad.map((f, k) => `<label class="opt"><input type="radio" name="fl" value="${k}" ${k === 0 ? 'checked' : ''}><div><div style="font-weight:500">${h(f.t)}</div><div class="sub">${h(f.s)}</div></div></label>`).join(''), actions: [{ label: 'Add it', run: () => { const k = +modalEl.querySelector('input[name="fl"]:checked').value; const id = A.addRisk(3, bad[k].t, 3, 3); U.rSel = id; go('risks'); toast('On your card. Score it for your own situation.'); return true; } }, { label: 'Cancel' }] }); break; }
    case 'sc.mine': { const f = Store.s.facts; const num = (k) => { const x = f.find(y => y.k === k); if (!x) return null; const m = String(x.v).replace(/[^0-9.]/g, ''); return m ? +m : null; }; const bal = num('Mortgage balance'); if (bal) Store.s.sc.price = Math.round(bal * 1.35); const pay = num('Take-home pay, together'); if (pay) Store.s.sc.income = Math.round(pay * 12 * 1.35); Store.commit(); toast('Filled from the figures on your card. Change anything that is wrong.'); break; }
    /* know this */
    case 'k.tag': U.kTag = v; U.kSel = null; render(); break;
    case 'know.open': U.kSel = id; go('know'); break;
    case 'k.close': U.kSel = null; render(); break;
    case 'k.ask': { const l = LIB.find(x => x.id === id); modal({ title: 'Ask your broker', sub: l.t, body: `<div class="sub">Copy this, or send it from here once your card is shared.</div><textarea class="input" data-fx="t" style="min-height:120px">${h(l.do)}</textarea>`, actions: [{ label: 'Add to my card as a question', run: () => { A.note('r3', val('[data-fx="t"]')); A.log('Question for the broker added.', l.t); Store.commit(); toast('On your card. They will see it when you share.'); return true; } }, { label: 'Close' }] }); break; }
    case 'k.torisk': { const l = LIB.find(x => x.id === id); const rid = A.addRisk(2, l.t, 3, 3); U.rSel = rid; go('risks'); toast('Added as a risk. Score it for your own situation.'); break; }
    /* chat */
    case 'chat.ans': A.chatAnswer(v); break;
    case 'chat.own': ownModal(); break;
    case 'chat.back': A.chatBack(); break;
    case 'chat.reset': A.chatReset(); toast('Back to the start. Your card is untouched.'); break;
    case 'chat.earlier': modal({ title: 'Earlier', sub: 'Everything you have said so far', body: Store.s.chat.answers.map((x, i) => `<div class="alog" style="grid-template-columns:28px minmax(0,1fr)"><span class="mono sub">${i + 1}</span><span>${h(x)}</span></div>`).join('') || '<span class="sub">Nothing yet.</span>', actions: [{ label: 'Done' }] }); break;
    default: toast('Coming soon: ' + a);
  }
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-f^="sc."]'); if (!el) return;
  const k = el.dataset.f.slice(3); const pos = el.selectionStart;
  A.sc(k, el.value);
  const again = document.querySelector('[data-f="sc.' + k + '"]');
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (x) {} }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('hashchange', () => { const r = location.hash.replace(/^#\/?/, '') || 'card'; if (r !== U.route) go(r, true); });
Store.load();
go(location.hash.replace(/^#\/?/, '') || 'card', true);

</script>
</body>
</html>
