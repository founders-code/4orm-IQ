<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>4orm Broker Dashboard</title>
<meta name="description" content="4orm broker dashboard demo. Example brokerage, example data. Every click works and persists in this browser.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-css">
html,body{margin:0;background:#F5F6F9;height:100%}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:inherit;color:inherit}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;background-image:linear-gradient(90deg,#0B1530 0 244px,#F5F6F9 244px);font-family:Geist,Inter,system-ui,sans-serif;color:#0B1324;font-size:14px;-webkit-font-smoothing:antialiased;background:#F5F6F9}
.side{background:#0B1530;color:#C7D0E4;padding:18px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto}
.ws{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);width:100%;border:0;text-align:left;cursor:pointer}
.mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,#2E6BF2,#6A93F7);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6C7896;font-weight:600;padding:0 10px;margin-bottom:6px}
.nl{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;font-size:14px;font-weight:500;color:#C7D0E4;width:100%;border:0;background:transparent;cursor:pointer;text-align:left}
.nl:hover{background:rgba(255,255,255,.05);color:#fff}
.nl.on{background:rgba(46,107,242,.2);color:#fff}
.ct{font-size:12px;color:#8C97B2;font-family:'Geist Mono',monospace}
.ct.r{background:#E0362C;color:#fff;border-radius:999px;padding:1px 7px;font-weight:600}
.ct.a{background:#D9910B;color:#fff;border-radius:999px;padding:1px 7px;font-weight:600}
.main{display:flex;flex-direction:column;min-width:0}
.hdr{display:flex;align-items:center;gap:16px;padding:14px 28px;background:#F5F6F9;position:sticky;top:0;z-index:5}
.title{font-size:15px;font-weight:600;white-space:nowrap}
.title span{color:#8A93A8;font-weight:500}
.search{flex:1;max-width:420px;display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 12px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(11,19,36,.06);color:#8A93A8;font-size:13px;margin-left:12px;border:0;cursor:text;text-align:left}
.kbd{font-family:'Geist Mono',monospace;font-size:11px;color:#6B7590;background:#F0F2F6;border-radius:5px;padding:2px 6px}
.body{padding:6px 28px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace;font-feature-settings:"tnum"}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;background:#2E6BF2;color:#fff;border:0;cursor:pointer;box-shadow:0 1px 2px rgba(46,107,242,.3),inset 0 1px 0 rgba(255,255,255,.18);white-space:nowrap}
.btn:hover{background:#2560E0}
.btn:disabled{background:#B9CDF9;box-shadow:none;cursor:default}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;font-size:13.5px;font-weight:600;background:#fff;color:#0B1324;border:0;cursor:pointer;box-shadow:0 1px 2px rgba(11,19,36,.08),0 0 0 1px rgba(11,19,36,.07);white-space:nowrap}
.btn2:hover{background:#F7F8FB}
.btn2:disabled{color:#9AA3B7;cursor:default}
.btn.red{background:#E0362C;box-shadow:0 1px 2px rgba(224,54,44,.3)}
.btn.dark{background:#0B1324;box-shadow:none}
.sm{height:30px;padding:0 11px;font-size:12.5px;border-radius:8px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(11,19,36,.04),0 6px 20px -10px rgba(11,19,36,.10);min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px 0}
.ct1{font-size:15px;font-weight:600;letter-spacing:-.005em}
.sub{font-size:12.5px;color:#6B7590}
.h1{font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.kv{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.delta{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px}
.up,.dn{background:#E6F6EF;color:#137A50}.bad{background:#FDECEB;color:#B42318}.warn{background:#FFF4DE;color:#995C00}.neu{background:#EEF1F6;color:#4A5570}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;display:block}
.p-r{background:#FDECEB;color:#B42318}.p-r i{background:#E0362C}
.p-a{background:#FFF4DE;color:#995C00}.p-a i{background:#D9910B}
.p-g{background:#E6F6EF;color:#137A50}.p-g i{background:#1F9D6A}
.p-b{background:#EAF0FE;color:#1F4FBF}.p-b i{background:#2E6BF2}
.p-n{background:#EEF1F6;color:#4A5570}.p-n i{background:#8A93A8}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;color:#4A5570;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.tab:hover{background:#EEF1F6}
.tab .c{font-size:11.5px;background:#EEF1F6;color:#4A5570;border-radius:6px;padding:1px 6px;font-family:'Geist Mono',monospace}
.tab.on{background:#0B1324;color:#fff}.tab.on .c{background:rgba(255,255,255,.16);color:#fff}
.seg{display:inline-flex;background:#E9ECF2;border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;font-size:13px;font-weight:500;color:#4A5570;height:30px;padding:0 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#fff;color:#0B1324;box-shadow:0 1px 2px rgba(11,19,36,.1)}
.fchip{border:0;height:30px;padding:0 11px;border-radius:8px;background:#fff;color:#4A5570;font-size:12.5px;font-weight:500;cursor:pointer;box-shadow:0 0 0 1px rgba(11,19,36,.08);display:inline-flex;align-items:center;gap:7px}
.fchip.on{background:#0B1324;color:#fff;box-shadow:none}
.th{display:grid;gap:14px;align-items:center;padding:0 20px;height:34px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#7A849C;background:#F8F9FB}
.tr{display:grid;gap:14px;align-items:center;padding:0 20px;min-height:56px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-size:14px;color:inherit}
.tr:nth-child(even){background:#FBFCFD}
.tr:hover{background:#F2F6FF}
.tr.sel{background:#EAF0FE}
.tr>*{min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chain{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:2px}
.chain i{height:14px;border-radius:3px;display:block}
.s{background:#2E6BF2}.x{background:#E0362C}.w{background:#F2B544}.o{background:#E6EAF1}
.stg{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:6px 12px;align-items:center}
.trk{grid-column:1 / -1;height:8px;border-radius:4px;background:#EEF1F6;overflow:hidden;display:flex}
.trk i{display:block;height:100%}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#7A849C}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-r{background:#E0362C;box-shadow:0 0 0 3px rgba(224,54,44,.16)}.d-a{background:#D9910B;box-shadow:0 0 0 3px rgba(217,145,11,.16)}.d-g{background:#1F9D6A;box-shadow:0 0 0 3px rgba(31,157,106,.14)}.d-b{background:#2E6BF2}.d-n{background:#B5BCCB}.d-k{background:#B5BCCB}
.toggle{width:36px;height:20px;border-radius:999px;background:#2E6BF2;position:relative;flex:none;border:0;cursor:pointer;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:18px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.toggle.off{background:#CBD2DF}.toggle.off::after{left:2px}
.toggle.lock{opacity:.55;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.input{height:38px;border-radius:10px;background:#F5F6F9;padding:0 12px;display:flex;align-items:center;font-size:13.5px;color:#0B1324;border:0;width:100%;font-family:inherit;outline:none}
.input:focus{box-shadow:0 0 0 2px #2E6BF2}
textarea.input{height:auto;min-height:110px;padding:10px 12px;resize:vertical;line-height:1.5}
.banner{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#FDECEB,#FFF6F5)}
.banner.ok{background:linear-gradient(90deg,#E6F6EF,#F2FAF6)}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#0B1324;color:#fff;font-size:11.5px;font-weight:500;white-space:nowrap;padding:5px 8px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .12s}
/* overview */
.files{grid-template-columns:96px minmax(0,1.7fr) minmax(0,1.1fr) 104px 168px 116px 64px}
.issues{grid-template-columns:84px minmax(0,2.2fr) 112px 56px 78px;gap:10px}
.agents{grid-template-columns:minmax(0,1.6fr) 48px minmax(0,1.1fr) 62px;gap:10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px;padding:0 2px;min-width:0}
.bar{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;position:relative}
.bar i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:#B9CDF9;min-height:3px;transition:background .15s}
.bar.last i{background:#2E6BF2}
.bar:hover i{background:#2E6BF2}
.bar:hover .tip{opacity:1}
.grid-y{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.grid-y span{font-size:11px;color:#9AA3B7;font-family:'Geist Mono',monospace}
.act{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:9px 0}
/* files */
.ftab{grid-template-columns:76px minmax(0,1.8fr) 96px 104px 128px 96px 58px;gap:10px}
.drawer{width:340px;flex:none;align-self:flex-start;position:sticky;top:70px}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.step{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.node{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'Geist Mono',monospace}
.n-s{background:#2E6BF2;color:#fff}.n-x{background:#E0362C;color:#fff;box-shadow:0 0 0 4px rgba(224,54,44,.16)}.n-w{background:#FFF1D6;color:#995C00}.n-o{background:#EEF1F6;color:#9AA3B7}
/* evidence */
.fl{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;font-size:14px;color:inherit}
.fl:hover{background:#F2F4F8}
.fl.on{background:#EAF0FE}
.link{display:grid;grid-template-columns:34px minmax(0,1fr);gap:16px}
.rail{display:flex;flex-direction:column;align-items:center}
.enode{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:12.5px;font-weight:600;flex:none}
.wire{width:2px;flex:1;min-height:12px;border-radius:2px}
.lk{border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff;box-shadow:0 0 0 1px rgba(11,19,36,.06)}
.lk.bad{background:#FFF7F6;box-shadow:0 0 0 1.5px rgba(224,54,44,.45)}
.lk.wait{background:#FFFBF2}
.lk.off{background:#FAFBFC;box-shadow:none}
.kvr{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;font-size:13px;padding:6px 0}
.alog{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:8px 0;font-size:13px}
/* control map */
.map{position:relative;margin:0 auto}
.ln{position:absolute;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#2E6BF2;white-space:nowrap}
.nd{text-align:left;position:absolute;width:116px;height:74px;border-radius:12px;background:#fff;border:0;box-shadow:0 0 0 1.5px #DCE3EF,0 6px 14px -10px rgba(11,19,36,.3);padding:9px 10px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:box-shadow .15s,transform .15s;font-family:inherit}
.nd:hover{transform:translateY(-1px)}
.nd .t{font-size:11.5px;overflow-wrap:break-word;font-weight:600;line-height:1.22;color:#0B1324}
.nd .c{font-family:'Geist Mono',monospace;font-size:11px;color:#4A5570;padding-right:14px}
.nd .dot{position:absolute;bottom:12px;right:10px}
.nd.red{background:#FFF6F5;box-shadow:0 0 0 2px #E0362C,0 0 0 8px rgba(224,54,44,.1)}
.nd.amb{background:#FFFBF2;box-shadow:0 0 0 2px #E5A93A}
.nd.mine{background:#F3FBF7;box-shadow:0 0 0 1.5px #7CC4A3}
.nd.sel{box-shadow:0 0 0 2px #2E6BF2,0 0 0 7px rgba(46,107,242,.18)}
.nd.red.sel{box-shadow:0 0 0 2px #E0362C,0 0 0 7px rgba(46,107,242,.25)}
.h{position:absolute;height:2px;background:#AFC2E6}
.h::after{content:"";position:absolute;right:-1px;top:-4px;border-left:6px solid #AFC2E6;border-top:5px solid transparent;border-bottom:5px solid transparent}
.v{position:absolute;width:2px;background:#AFC2E6}
.v::after{content:"";position:absolute;bottom:-1px;left:-4px;border-top:6px solid #AFC2E6;border-left:5px solid transparent;border-right:5px solid transparent}
.mlog{grid-template-columns:56px 14px 84px minmax(0,1fr) 110px}
/* reports */
.ri{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;color:inherit;font-size:14px}
.ri:hover{background:#F2F4F8}
.ri.on{background:#EAF0FE}
.doc{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(11,19,36,.04),0 20px 50px -30px rgba(11,19,36,.35);padding:30px 34px}
.m{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:#F7F8FB}
.m .mval{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.vb{display:flex;align-items:flex-end;gap:6px;height:120px}
.vb div{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.vb i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:#B9CDF9;min-height:3px}
.vb i.last{background:#2E6BF2}
.rt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 0;font-size:13px}
.rt.hd{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#7A849C;padding-bottom:6px}
.sch{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr) 90px 90px}
/* ai */
.tool{grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 80px 70px 100px 90px}
.ev{display:grid;grid-template-columns:52px 10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left;font-family:inherit;color:inherit;font-size:14px}
.ev:hover{background:#F2F4F8}
.ev.on{background:#EAF0FE}
.quote{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.55}
.q-bad{background:#FFF6F5;box-shadow:inset 3px 0 0 #E0362C}
.q-good{background:#F2FAF6;box-shadow:inset 3px 0 0 #1F9D6A}
.gr{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:12px;align-items:center;padding:11px 0}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:stretch}
.fs{border-radius:12px;padding:12px;background:#F7F8FB;display:flex;flex-direction:column;gap:4px;position:relative}
.fs.hot{background:#0B1530;color:#fff}
/* agents */
.agc{padding:18px 20px;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:box-shadow .15s;border:0;text-align:left;font-family:inherit;color:inherit;font-size:14px;width:100%}
.agc.on{box-shadow:0 0 0 2px #2E6BF2,0 10px 30px -14px rgba(46,107,242,.45)}
.af{grid-template-columns:86px minmax(0,1.6fr) 120px 150px 100px}
.acc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;font-size:13px}
/* connections */
.cn{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.cnk{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:12.5px}
.logo{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
/* settings */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{text-align:left;border:0;background:transparent;height:34px;padding:0 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:#4A5570;cursor:pointer}
.snav button.on{background:#fff;color:#0B1324;box-shadow:0 1px 2px rgba(11,19,36,.08)}
/* builder */
.libh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:#7A849C;margin:6px 0 2px}
.li{text-align:left;font-size:13.5px;font-weight:600;min-height:42px;padding:6px 12px;border-radius:10px;border:1.5px solid #E1E7F1;background:#fff;color:#0B1324;width:100%;display:flex;align-items:center;gap:10px;cursor:grab;font-family:inherit}
.li.armed{border-color:#2E6BF2;background:#EEF3FE}
.li small{font-size:11.5px;font-weight:500;color:#6B7590;margin-left:auto}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.canvas{background-color:#fff;background-image:radial-gradient(#D3DCEB 1.2px,transparent 1.2px);background-size:22px 22px;border-radius:16px;min-width:0;box-shadow:0 1px 2px rgba(11,19,36,.04),0 6px 20px -10px rgba(11,19,36,.10)}
.bmap{position:relative}
.bnd{text-align:left;position:absolute;width:120px;height:86px;border-radius:14px;background:#fff;border:2px solid #DCE4F0;padding:8px 10px;display:flex;flex-direction:column;gap:3px;box-shadow:0 6px 16px -10px rgba(14,26,51,.25);cursor:pointer;font-family:inherit}
.bnd.mine{background:#F3FBF7;border-color:#7CC4A3}
.bnd.sel{box-shadow:0 0 0 4px rgba(46,107,242,.3);border-color:#2E6BF2}
.bnd.over{border-color:#2E6BF2;background:#EEF3FE}
.bnd .k{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.bnd .t{font-size:12px;font-weight:700;line-height:1.22;overflow-wrap:break-word}
.bnd .p{font-family:'Geist Mono',monospace;font-size:9.5px;font-weight:600;background:#EEF2F8;border-radius:5px;padding:2px 5px;align-self:flex-start;margin-top:auto}
.slot{position:absolute;width:120px;height:86px;border-radius:14px;border:2px dashed #AFC2E6;background:rgba(255,255,255,.7);color:#2E6BF2;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.slot.hot,.slot.over{background:#EEF3FE;border-color:#2E6BF2}
.rm{font-size:13px;font-weight:700;border:0;background:#FDECEB;color:#B42318;border-radius:999px;min-height:36px;padding:0 14px;align-self:flex-start;cursor:pointer;font-family:inherit}
.kv2{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:13.5px;line-height:1.4}
.say{background:#F4F6FA;border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.5}

/* modal, toast, palette */

.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}

.toast button{background:transparent;border:0;color:#7FA4FA;font-weight:600;cursor:pointer;font-size:13.5px}
.pal{position:fixed;inset:0;background:rgba(11,19,36,.4);z-index:55;display:flex;justify-content:center;padding-top:12vh}

.scrollx{position:relative}.scrollx::after{content:"";position:absolute;top:0;right:0;bottom:6px;width:48px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);pointer-events:none;border-radius:0 16px 16px 0}

    try { const raw = localStorage.getItem(STORE_KEY); if (raw) { const p = JSON.parse(raw); if (p && p.v === 1) { this.s = p; return; } } } catch (e) { }
    this.s = seedState();
  },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.s)); } catch (e) { } },
  reset() { this.s = seedState(); this.save(); this.emit(); },
  emit() { this.listeners.forEach(fn => fn()); },
  commit() { this.save(); this.emit(); },
  stamp() { const m = NOW.m + 1 + this.s.clock; this.s.clock++; const h = NOW.h + Math.floor(m / 60); return String(h).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); },
  snapshot() { return JSON.stringify(this.s); },
  restore(snap) { this.s = JSON.parse(snap); this.commit(); }
};

/* ---------- derived ---------- */
const D = {
  agent(id) { return Store.s.agents.find(a => a.id === id) || { id, name: 'Unassigned', ini: '?', color: '#8A93A8', role: '' }; },
  file(id) { return Store.s.files.find(f => f.id === id); },
  open() { return Store.s.files.filter(f => f.chain !== 'SSSSSSSSS'); },
  kept() { return Store.s.files.filter(f => f.chain === 'SSSSSSSSS'); },
  sealed(f) { return f.chain.split('').filter(c => c === 'S').length; },
  status(f) {
    if (f.chain === 'SSSSSSSSS') return 'k';
    if (f.chain.indexOf('X') >= 0) return 'r';
    if (f.chain.indexOf('W') >= 0 || f.coConsent === 'W' || f.consentDays <= 14) return 'a';
    return 'g';
  },
  stage(f) { if (f.chain === 'SSSSSSSSS') return 'Kept'; const first = f.chain.search(/[^S]/); if (first < 3) return 'Intake'; if (first < 6) return 'Suitability'; return 'Close and keep'; },
  issue(f) {
    if (f.issue && (this.status(f) !== 'g' || f.nw)) return f.issue;
    const st = this.status(f);
    if (st === 'k') return 'Closed ' + (f.closed || '') + ' · kept 5 years';
    const first = f.chain.search(/[^S]/);
    const names = ['Card received', 'Future plans next', 'Capacity check running', 'Risks being ranked', 'Disclosure due', 'Recommendation next', 'Waiting on acknowledgement', 'Waiting on lender', 'Closing'];
    return names[first] || '';
  },
  ord(f) { const st = this.status(f); return st === 'r' ? 0 : st === 'a' ? 1 : st === 'g' ? 2 : 3; },
  sortFiles(arr) { return arr.slice().sort((a, b) => this.ord(a) - this.ord(b) || (b.nw - a.nw) || a.id.localeCompare(b.id)); },
  counts() {
    const open = this.open();
    const r = open.filter(f => this.status(f) === 'r').length, a = open.filter(f => this.status(f) === 'a').length;
    const intact = open.filter(f => ['g', 'k'].indexOf(this.status(f)) >= 0).length;
    return { open: open.length, r, a, intact, pct: Math.round(intact / Math.max(1, open.length) * 100), held: open.filter(f => f.held).length, nw: open.filter(f => f.nw).length, kept: this.kept().length };
  },
  byStage() { const o = this.open(); const g = { 'Intake': [], 'Suitability': [], 'Close and keep': [] }; o.forEach(f => g[this.stage(f)].push(f)); return g; },
  stepCount(i) { const o = this.open(); return { pass: o.filter(f => f.chain[i] === 'S').length, x: o.filter(f => f.chain[i] === 'X').length, w: o.filter(f => f.chain[i] === 'W').length, total: o.length }; },
  nodeCount(key) {
    const o = this.open(), n = o.length;
    switch (key) {
      case 'card': case 'shared': case 'opened': return { pass: n, total: n, x: 0, w: 0, files: [] };
      case 'situation': return { pass: o.filter(f => f.chain[0] === 'S' && f.chain[1] === 'S').length, total: n, x: 0, w: 0, files: [] };
      case 'capacity': { const fs = o.filter(f => f.chain[2] !== 'S' && (f.chain[2] === 'W' || f.consentDays <= 14)); const amb = o.filter(f => f.consentDays <= 14 || f.chain[2] === 'W'); return { pass: o.filter(f => f.chain[2] === 'S').length, total: n, x: 0, w: amb.length, files: amb }; }
      case 'coconsent': { const j = o.filter(f => f.who === 'Joint'); const w = j.filter(f => f.coConsent === 'W'); return { pass: j.filter(f => f.coConsent === 'S').length, total: j.length, x: 0, w: w.length, files: w }; }
      case 'disclosed': return this.stepFiles(4);
      case 'advice': return this.stepFiles(5);
      case 'ack': { const r = this.stepFiles(6); r.total = o.filter(f => f.chain[5] === 'S').length; return r; }
      case 'lender': { const held = o.filter(f => f.held); return { pass: o.filter(f => f.chain[7] === 'S').length, total: o.filter(f => f.chain[6] === 'S').length, x: 0, w: held.length, files: held, sent: true }; }
      case 'kept': return { pass: this.kept().length, total: this.kept().length, x: 0, w: 0, files: [], keptLabel: true };
      default: return null;
    }
  },
  stepFiles(i) { const o = this.open(); const bad = o.filter(f => f.chain[i] === 'X' || f.chain[i] === 'W'); return { pass: o.filter(f => f.chain[i] === 'S').length, total: o.filter(f => f.chain.slice(0, i).indexOf('O') < 0).length, x: o.filter(f => f.chain[i] === 'X').length, w: o.filter(f => f.chain[i] === 'W').length, files: bad }; },
  alerts() {
    const o = this.open();
    const out = [];
    o.forEach(f => { const st = this.status(f); if (st === 'r' || st === 'a') out.push({ f, st, t: f.last, w: this.issue(f), agent: this.agent(f.agent) }); });
    return out.sort((a, b) => (a.st === 'r' ? 0 : 1) - (b.st === 'r' ? 0 : 1));
  },
  agentStats(id) {
    const fs = this.open().filter(f => f.agent === id);
    const intact = fs.filter(f => ['g'].indexOf(this.status(f)) >= 0).length;
    const r = fs.filter(f => this.status(f) === 'r').length, a = fs.filter(f => this.status(f) === 'a').length;
    return { files: fs.length, pct: fs.length ? Math.round(intact / fs.length * 100) : 100, r, a, ps: r ? r + ' red' : a ? a + ' amber' : 'Clean', pc: r ? 'p-r' : a ? 'p-a' : 'p-g' };
  },
  compliance() {
    // share of files that reached a step and hold its record
    const held = (i) => { const c = this.stepCount(i); const due = c.pass + c.x + c.w; const bits = []; if (c.x) bits.push(c.x + ' missing'); if (c.w) bits.push(c.w + ' waiting'); return { v: due ? Math.round(c.pass / due * 100) : 100, bad: c.x > 0, warn: c.w > 0, open: c.x + c.w, label: bits.join(' · ') || 'Clean' }; };
    const s0 = held(1), s2 = held(2), s4 = held(4), s6 = held(6);
    return [
      Object.assign({ t: 'Situation and future plans' }, s0),
      Object.assign({ t: 'Financial capacity confirmed' }, s2),
      Object.assign({ t: 'Material risks disclosed' }, s4),
      Object.assign({ t: 'Consumer acknowledgement' }, s6),
      { t: 'FINTRAC records, 5 years', v: 100, bad: false, warn: false, open: 0, label: 'Clean' }
    ];
  }
};

/* ---------- actions (every control calls one of these) ---------- */
const A = {
  log(f, a, d) { f.log = f.log || []; f.log.unshift({ t: Store.stamp(), a, d }); },
  activity(a, d) { Store.s.activity.unshift({ t: Store.stamp(), a, d }); if (Store.s.activity.length > 12) Store.s.activity.pop(); },
  setChain(f, i, c) { const arr = f.chain.split(''); arr[i] = c; f.chain = arr.join(''); },

  /* evidence chain */
  sendDisclosure(id) {
    const f = D.file(id); if (!f) return;
    A.setChain(f, 4, 'W');
    f.docs.push({ n: 'Written risk disclosure', f: 'Agent', t: 'now', s: 'awaiting signature' });
    A.log(f, 'Disclosure sent to the consumer.', 'Drafted from the top ' + Math.min(3, f.risks) + ' risks on their card. Waiting for their acknowledgement on their phone.');
    A.activity('Disclosure sent on ' + id + '.', 'Waiting for the consumer to acknowledge.');
    f.last = 'now'; Store.commit();
  },
  consumerSigns(id) {
    const f = D.file(id); if (!f) return;
    const arr = f.chain.split('');
    let i = arr.findIndex(c => c === 'W' || c === 'X');
    if (i < 0) i = arr.indexOf('O');
    if (i < 0) return;
    arr[i] = 'S';
    // a recommendation recorded out of order reseals once risks are disclosed
    if (i === 4 && arr[5] === 'W') arr[5] = 'S';
    f.chain = arr.join('');
    if (f.chain[4] === 'S') f.held = false;
    if (f.coConsent === 'W') f.coConsent = 'S';
    if (f.consentDays <= 14) f.consentDays = 365;
    if (f.chain.indexOf('X') < 0 && f.chain.indexOf('W') < 0) f.issue = '';
    f.docs.forEach(d => { if (d.s === 'awaiting signature' || d.s === 'not sealed') d.s = seal(i + 1, id); });
    A.log(f, STEPS[i].name + ' sealed.', 'Seal ' + seal(i + 1, id) + '. Signed by ' + (f.names || 'the consumer') + ' on their phone.');
    A.activity(STEPS[i].name + ' sealed on ' + id + '.', 'Chain is ' + D.sealed(f) + ' of 9.');
    if (f.chain === 'SSSSSSSSS') { f.closed = 'today'; f.issue = 'Closed today · kept 5 years'; }
    f.last = 'now'; Store.commit();
  },
  sendReminder(id) { const f = D.file(id); if (!f) return; A.log(f, 'Reminder sent.', 'Short note with the one risk they marked unclear.'); A.activity('Reminder sent on ' + id + '.', 'Acknowledgement still waiting.'); f.last = 'now'; Store.commit(); },
  request(id, what) {
    const f = D.file(id); if (!f) return;
    if (what === 'renewal') { f.consentDays = 365; f.issue = 'Consent renewal requested'; A.log(f, 'Bank consent renewal requested.', 'The consumer renews it on their phone. Capacity stays confirmed through closing.'); }
    if (what === 'invite') { f.issue = 'Co-borrower invite resent'; A.log(f, 'Co-borrower invite resent.', 'The 3 minute version of the card.'); }
    if (what === 'gift') { f.issue = 'Gift letter requested'; f.docs.push({ n: 'Gift letter', f: 'Consumer', t: 'requested', s: 'pending' }); A.log(f, 'Gift letter requested.', "With the donor's bank confirmation, so FINTRAC records stay complete."); }
    A.activity(f.issue + ' on ' + id + '.', ''); f.last = 'now'; Store.commit();
  },
  reassign(id, agentId) { const f = D.file(id); if (!f) return; const from = D.agent(f.agent).name, to = D.agent(agentId).name; f.agent = agentId; A.log(f, 'Reassigned to ' + to + '.', 'From ' + from + '. Logged to the file.'); A.activity(id + ' reassigned to ' + to + '.', ''); Store.commit(); },
  share(id) { const f = D.file(id); if (!f) return; A.log(f, 'Record shared with the consumer.', 'They see the same sealed chain on their phone.'); Store.commit(); },
  note(id, text) { const f = D.file(id); if (!f || !text) return; A.log(f, 'Note by ' + Store.s.user.name + '.', text); Store.commit(); },

  /* agents */
  invite(name, role) { const parts = name.trim().split(/\s+/); const id = parts.join('-').toLowerCase().replace(/[^a-z-]/g, '') || ('a' + Date.now()); const colors = ['#7C5CE0', '#1F9D6A', '#D9910B', '#E0362C']; Store.s.agents.push({ id, name: name.trim(), role: role || 'Agent', color: colors[Store.s.agents.length % colors.length], ini: parts.map(p => p[0]).join('').slice(0, 2).toUpperCase(), review: 0, invited: true }); A.activity(name.trim() + ' invited.', 'Their own space is ready. They see only their files.'); Store.commit(); return id; },
  coach(agentId, text) { A.activity('Coaching note sent to ' + D.agent(agentId).name + '.', text); Store.commit(); },

  /* AI monitor */
  rail(id) { const r = Store.s.ai.rails.find(x => x.id === id); if (!r || r.lock) return false; r.on = !r.on; Store.commit(); return true; },
  tighten(toolId) { const t = Store.s.ai.tools.find(x => x.id === toolId); if (!t) return; t.status = 'g'; t.st = 'Tightened'; t.sees = 'Public rates page. Scripted answers only'; Store.s.ai.events.forEach(e => { if (e.tool === toolId) e.open = false; }); A.activity(t.name + ' tightened.', 'Scripted answers only. No promises, no product picks.'); Store.commit(); },
  resolveEvent(id) { const e = Store.s.ai.events.find(x => x.id === id); if (!e) return; e.open = false; e.action = e.k === 'leak' ? 'Reviewed' : 'Sent'; e.pc = 'p-g'; A.activity('AI flag closed on ' + e.file + '.', e.title); Store.commit(); },
  addTool(name, use) { const id = 't' + Date.now(); Store.s.ai.tools.push({ id, name, use: use || 'New tool', sees: 'Redacted prompts only, until you widen it', checks: 0, flags: 0, status: 'g', st: 'Connected', on: true }); A.activity(name + ' connected to the AI monitor.', 'Every call goes through 4ormIQ first.'); Store.commit(); },
  toolToggle(id) { const t = Store.s.ai.tools.find(x => x.id === id); if (!t) return; t.on = !t.on; t.st = t.on ? 'Healthy' : 'Paused'; t.status = t.on ? 'g' : 'n'; Store.commit(); },

  /* connections */
  connToggle(id) { const c = Store.s.connections.find(x => x.id === id); if (!c) return; c.on = !c.on; c.ps = c.on ? 'Healthy' : 'Paused'; c.pc = c.on ? 'p-g' : 'p-n'; Store.commit(); },
  addConn(name, cat) { Store.s.connections.push({ id: 'c' + Date.now(), k: 'other', name, cat: cat || 'Custom', mono: name.slice(0, 2).toUpperCase(), lc: '#4A5570', ps: 'Connected', pc: 'p-g', gets: 'Only what you allow here', never: 'Evidence, bank data, risk details', sync: 'just now', on: true }); A.activity(name + ' connected.', 'It gets its own light on the control map.'); Store.commit(); },

  /* settings */
  rule(id) { const r = Store.s.rules.find(x => x.id === id); if (!r || r.lock) return false; r.on = !r.on; Store.commit(); return true; },
  saveBrokerage(obj) { Object.assign(Store.s.brokerage, obj); Store.commit(); },

  /* reports */
  schedule(r, when, to) { Store.s.schedules.push({ id: 's' + Date.now(), r, when, to, st: 'Scheduled', pc: 'p-b' }); Store.commit(); },
  unschedule(id) { Store.s.schedules = Store.s.schedules.filter(s => s.id !== id); Store.commit(); },

  /* process builder */
  procClone() { return Store.s.process.lanes.map(l => Object.assign({}, l, { steps: l.steps.map(s => Object.assign({}, s)) })); },
  procLog(lanes, text) { const p = Store.s.process; p.lanes = lanes; p.changes.push({ time: Store.stamp(), text }); Store.commit(); },
  procInsert(li, at, tpl) {
    if (!tpl || tpl.type === 'plug') return null;
    const lanes = A.procClone(); const p = Store.s.process; p.n++; const id = 'n' + p.n;
    lanes[li].steps.splice(at, 0, { id, kind: tpl.kind, name: tpl.name, meta: tpl.meta || 'Agent', rule: null, plug: null, mine: true, key: null });
    A.procLog(lanes, 'Added "' + tpl.name + '" to ' + lanes[li].title); return id;
  },
  procAttach(id, tpl) { const lanes = A.procClone(); let name = ''; lanes.forEach(l => l.steps.forEach(s => { if (s.id === id) { s.plug = tpl.label + ' · ' + tpl.who; name = s.name; } })); A.procLog(lanes, 'Connected ' + tpl.who + ' to "' + name + '"'); },
  procRemove(id) { const lanes = A.procClone(); let name = ''; lanes.forEach(l => { const i = l.steps.findIndex(s => s.id === id); if (i >= 0 && l.steps[i].mine) { name = l.steps[i].name; l.steps.splice(i, 1); } }); if (name) A.procLog(lanes, 'Removed "' + name + '"'); return name; },
  procRename(id, name) { const lanes = A.procClone(); lanes.forEach(l => l.steps.forEach(s => { if (s.id === id && s.mine) s.name = name; })); A.procLog(lanes, 'Renamed a block to "' + name + '"'); },
  procReset() { Store.s.process = baseProcess(); Store.commit(); },
  procPublish() { const p = Store.s.process; const k = p.changes.length; const [a, b] = p.version.split('.').map(Number); p.version = a + '.' + (b + 1); p.published = 'published ' + Store.stamp() + ' with ' + k + ' change' + (k === 1 ? '' : 's'); p.changes = []; A.activity('Process v' + p.version + ' published to every agent.', 'The control map now carries your blocks.'); Store.commit(); },
  procHas(name) { let r = false; Store.s.process.lanes.forEach(l => l.steps.forEach(s => { if (s.name === name) r = true; })); return r; }
};

/* ---------- Control map ---------- */
function mapGeom() {
  const W = 116, NH = 74, LH = 140, P = 130, LX = [0, 148, 426, 704];
  const lanes = Store.s.process.lanes;
  const nodes = [], wires = [], labels = []; let maxR = 0;
  let start = 0;
  lanes.forEach((L, li) => {
    const x0 = li < 4 ? LX[li] : start; const y = li * LH;
    labels.push({ t: L.num + ' ' + L.title, x: x0 + (li ? 50 : 0), y });
    L.steps.forEach((s, k) => {
      const x = x0 + k * P, ny = y + 20;
      nodes.push({ s, x, y: ny });
      if (k < L.steps.length - 1) wires.push({ c: 'h', x: x + W + 1, y: ny + NH / 2 - 1, w: P - W - 3 });
      if (k === L.steps.length - 1 && li < lanes.length - 1) wires.push({ c: 'v', x: x + W / 2 - 1, y: ny + NH + 2, h: LH - NH - 4 });
      maxR = Math.max(maxR, x + W);
    });
    start = x0 + (L.steps.length - 1) * P + 48;
  });
  return { nodes, wires, labels, w: maxR, h: lanes.length * LH };
}

function go(route, keepScroll) { if (!PAGES[route]) route = 'overview'; U.route = route; if (location.hash !== '#/' + route) history.replaceState(null, '', '#/' + route); render(); if (!keepScroll) window.scrollTo(0, 0); }

/* ---------- toast ---------- */
let toastWrap;
function toast(msg, opts) {
  opts = opts || {};
  if (!toastWrap) { toastWrap = document.createElement('div'); toastWrap.className = 'toasts'; document.body.appendChild(toastWrap); }
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${h(msg)}</span>${opts.undo ? '<button data-t="undo">Undo</button>' : ''}<button data-t="x" aria-label="Dismiss">Dismiss</button>`;
  el.querySelector('[data-t="x"]').onclick = () => el.remove();
  if (opts.undo) el.querySelector('[data-t="undo"]').onclick = () => { opts.undo(); el.remove(); };
  toastWrap.appendChild(el); setTimeout(() => el.remove(), opts.ms || 5000);
}
function withUndo(label, fn) { const snap = Store.snapshot(); fn(); toast(label, { undo: () => { Store.restore(snap); toast('Undone'); } }); }

/* ---------- modal ---------- */
let modalEl = null;
function modal(o) {
  closeModal();
  modalEl = document.createElement('div'); modalEl.className = 'ovl'; modalEl.setAttribute('data-ovl', '1');
  modalEl.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="mh"><div><div style="font-size:18px;font-weight:600;letter-spacing:-.015em">${h(o.title)}</div>${o.sub ? `<div class="sub" style="margin-top:4px">${h(o.sub)}</div>` : ''}</div><button class="btn2 sm" data-m="close">Close</button></div><div class="mb">${o.body || ''}</div><div class="mf">${(o.actions || []).map((a, i) => `<button class="${a.cls || (i === 0 ? 'btn' : 'btn2')}" data-m="act" data-i="${i}">${h(a.label)}</button>`).join('')}</div></div>`;
  document.body.appendChild(modalEl);
  modalEl.addEventListener('click', (e) => {
    if (e.target === modalEl || e.target.closest('[data-m="close"]')) return closeModal();
    const b = e.target.closest('[data-m="act"]'); if (b) { const a = o.actions[+b.dataset.i]; const r = a.run ? a.run(modalEl) : true; if (r !== false) closeModal(); }
  });
  const first = modalEl.querySelector('input,textarea'); if (first) first.focus();
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
const val = (sel) => { const el = modalEl && modalEl.querySelector(sel); return el ? el.value.trim() : ''; };

/* ---------- downloads ---------- */
let dlCap; function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain' });
  const direct = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
  if (dlCap === undefined && window.claude && window.claude.use) { dlCap = claude.use('downloads').catch(() => null); }
  if (dlCap && dlCap.then) { dlCap.then(d => { if (d && d.save) d.save({ filename: name, data: text }).catch(() => toast('Download declined.')); else direct(); }); return; }
  direct();
}
function csv(rows) { return rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n'); }
function auditCSV() {
  const rows = [['File', 'Consumer decision', 'Borrowers', 'Risks ranked', 'Agent', 'Stage', 'Status', 'Sealed of 9', 'Chain', 'Issue', 'Last update']];
  Store.s.files.forEach(f => rows.push([f.id, f.what, f.who, f.risks, D.agent(f.agent).name, D.stage(f), ST[D.status(f)][1], D.sealed(f), f.chain, D.issue(f), f.last]));
  return csv(rows);
}
function printReport(k) {
  const doc = document.getElementById('report-doc');
  const html = doc ? doc.outerHTML : '<p>Open the report first.</p>';
  const w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups to download the PDF, or use Print from the browser menu.'); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${h(reportData(k).name)}</title><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"><style>${document.getElementById('app-css').textContent}body{background:#fff;padding:24px;font-family:Geist,system-ui,sans-serif}.doc{box-shadow:none;padding:0}.btn,.btn2{display:none}</style></head><body>${html}<script>setTimeout(function(){window.print()},600)<\/script></body></html>`);
  w.document.close();
}

/* ---------- search palette ---------- */
let pal = null;
function openSearch() {
  if (pal) return;
  pal = document.createElement('div'); pal.className = 'pal';
  pal.innerHTML = `<div class="palbox"><input type="search" placeholder="Search files, consumers, agents, pages" aria-label="Search"><div data-res></div></div>`;
  document.body.appendChild(pal);
  const inp = pal.querySelector('input'), res = pal.querySelector('[data-res]');
  let idx = 0, items = [];
  const list = (q) => {
    q = q.trim().toLowerCase(); items = [];
    Object.keys(TITLES).forEach(k => { if (!q || TITLES[k].toLowerCase().indexOf(q) >= 0) items.push({ k: 'Page', t: TITLES[k], s: '', run: () => go(k) }); });
    Store.s.agents.forEach(a => { if (!q || a.name.toLowerCase().indexOf(q) >= 0) items.push({ k: 'Agent', t: a.name, s: D.agentStats(a.id).files + ' open files', run: () => { U.agSel = a.id; go('agents'); } }); });
    Store.s.files.forEach(f => { if (!q || (f.id + ' ' + f.what + ' ' + (f.names || '')).toLowerCase().indexOf(q) >= 0) items.push({ k: 'File', t: f.id + ' · ' + f.what, s: (f.names || '') + ' · ' + D.issue(f), run: () => openFile(f.id) }); });
    items = items.slice(0, 9); idx = 0;
    res.innerHTML = items.map((it, i) => `<button class="palr${i === idx ? ' on' : ''}" data-i="${i}"><span class="lbl">${it.k}</span><span class="ell" style="font-weight:500">${h(it.t)}</span><span class="sub ell" style="max-width:220px">${h(it.s)}</span></button>`).join('') || '<div style="padding:14px 18px" class="sub">Nothing matches.</div>';
  };
  list('');
  inp.addEventListener('input', () => list(inp.value));
  inp.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, items.length - 1); list(inp.value); inp.focus(); } if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); } if (e.key === 'Enter' && items[idx]) { items[idx].run(); closeSearch(); } if (e.key === 'Escape') closeSearch(); });
  res.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) { items[+b.dataset.i].run(); closeSearch(); } });
  pal.addEventListener('click', (e) => { if (e.target === pal) closeSearch(); });
  inp.focus();
}
function closeSearch() { if (pal) { pal.remove(); pal = null; } }
function openFile(id) { U.eSel = id; U.fSel = id; U.eTab = 'chain'; go('evidence'); }

/* ---------- event delegation ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  // nested actions: prefer the innermost
  const a = el.dataset.a, id = el.dataset.id, v = el.dataset.v;
  const stop = () => { e.stopPropagation(); };
  switch (a) {
    case 'nav': go(v); break;
    case 'search.open': openSearch(); break;
    /* overview */
    case 'ov.range': U.range = v; render(); break;
    case 'ov.tab': U.ovTab = v; render(); break;
    /* files */
    case 'f.tab': U.fTab = v; render(); break;
    case 'f.agent': U.fAgent = v; render(); break;
    case 'f.stage': U.fStage = v; render(); break;
    case 'f.sel': U.fSel = id; render(); break;
    case 'file.open': stop(); openFile(id); break;
    case 'file.fix': stop(); fixModal(id); break;
    case 'file.remind': stop(); A.sendReminder(id); toast('Reminder sent on ' + id); break;
    case 'file.sign': stop(); withUndo('Signed on the consumer\'s phone. Link sealed on ' + id + '.', () => A.consumerSigns(id)); break;
    case 'file.request': stop(); A.request(id, v); toast({ renewal: 'Consent renewal requested', invite: 'Invite resent', gift: 'Gift letter requested' }[v] + ' on ' + id); break;
    case 'file.reassign': stop(); reassignModal(id); break;
    case 'file.note': stop(); noteModal(id); break;
    case 'file.reqdoc': reqDocModal(id); break;
    case 'file.share': A.share(id); toast('Link sent. The consumer sees the same sealed chain on their phone.'); break;
    case 'file.export': { const f = D.file(id); download(id + '-sealed-record.json', JSON.stringify({ file: f, steps: STEPS, exported: NOW.day + ' ' + Store.stamp() }, null, 2), 'application/json'); toast('Sealed record exported for ' + id); break; }
    /* evidence */
    case 'e.sel': U.eSel = id; render(); break;
    case 'e.tab': U.eTab = v; render(); break;
    /* map */
    case 'm.sel': U.mSel = id; render(); break;
    case 'm.agent': U.mAgent = v; render(); break;
    /* reports */
    case 'r.sel': U.rSel = v; render(); break;
    case 'r.range': U.rRange = v; render(); break;
    case 'r.open': U.rSel = v; go('reports'); break;
    case 'r.pdf': toast('Opening the print view. Choose Save as PDF.'); printReport(v); break;
    case 'r.send': sendModal(v); break;
    case 'r.schedule': scheduleModal(v); break;
    case 'r.unschedule': withUndo('Schedule removed', () => A.unschedule(id)); break;
    case 'r.audit': download('4orm-audit-report.csv', auditCSV(), 'text/csv'); toast('Audit report downloaded (CSV, every file and its chain).'); break;
    case 'r.pack': packModal(); break;
    case 'r.custom': modal({ title: 'New custom report', sub: 'Pick what it should count. It is built from the sealed evidence like the others.', body: ['Files by agent and stage', 'Time at each step', 'Consumer acknowledgements by week', 'AI flags by tool'].map((o, i) => `<label class="opt"><input type="radio" name="cr" value="${o}" ${i === 0 ? 'checked' : ''}><span style="font-weight:500">${o}</span></label>`).join(''), actions: [{ label: 'Create', run: () => { toast('Custom reports are built by the records vault. This demo keeps the six standard ones.'); return true; } }, { label: 'Cancel' }] }); break;
    /* ai */
    case 'ai.tab': U.aiTab = v; render(); break;
    case 'ai.sel': U.aiSel = id; render(); break;
    case 'ai.rail': { if (!A.rail(id)) toast('Required by 4orm. This guardrail cannot be switched off.'); break; }
    case 'ai.tighten': withUndo('Tool tightened. Scripted answers only.', () => { A.tighten(el.dataset.tool); A.resolveEvent(id); }); break;
    case 'ai.resolve': withUndo('Flag closed and sealed to the file.', () => A.resolveEvent(id)); break;
    case 'ai.view': toast('Opens the sealed record for this flag.'); break;
    case 'ai.coach': { const ev = Store.s.ai.events.find(x => x.id === id); modal({ title: 'Coach ' + (ev ? ev.who : 'agent'), body: `<textarea class="input" data-fx="msg">${h(ev ? 'Quick one on ' + ev.file + ': ' + ev.why + ' 4ormIQ caught it, nothing went out. Worth a 5 minute chat.' : '')}</textarea>`, actions: [{ label: 'Send', run: () => { A.activity('Coaching note sent.', ev ? ev.title : ''); Store.commit(); toast('Sent.'); return true; } }, { label: 'Cancel' }] }); break; }
    case 'ai.add': addToolModal(); break;
    case 'ai.tool': { A.toolToggle(id); const t = Store.s.ai.tools.find(x => x.id === id); toast(t.name + (t.on ? ' resumed. Calls go through 4ormIQ again.' : ' paused. No calls go through until you resume it.')); break; }
    /* agents */
    case 'ag.sel': U.agSel = id; render(); break;
    case 'ag.open': U.agSel = id; go('agents'); break;
    case 'ag.files': U.fAgent = id; U.fTab = 'all'; go('files'); break;
    case 'ag.mode': U.agMode = v; render(); break;
    case 'ag.invite': inviteModal(); break;
    case 'ag.coach': A.coach(id, ''); toast('Coaching note sent to ' + D.agent(id).name.split(' ')[0]); break;
    /* connections */
    case 'c.tab': U.cTab = v; render(); break;
    case 'c.settings': connModal(id, 'settings'); break;
    case 'c.activity': connModal(id, 'activity'); break;
    case 'c.toggle': { A.connToggle(id); const c = Store.s.connections.find(x => x.id === id); toast(c.name + (c.on ? ' resumed.' : ' paused. Nothing is shared until you resume it.')); break; }
    case 'c.add': addConnModal(); break;
    /* settings */
    case 's.sec': U.sSec = v; render(); break;
    case 's.rule': { if (!A.rule(id)) toast('Required block. It cannot be switched off.'); break; }
    case 's.save': { const o = {}; document.querySelectorAll('[data-f^="brokerage."]').forEach(i => { o[i.dataset.f.split('.')[1]] = i.value.trim() || Store.s.brokerage[i.dataset.f.split('.')[1]]; }); if (Object.keys(o).length) { o.mark = (o.short || Store.s.brokerage.short).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(); A.saveBrokerage(o); } toast('Saved.'); break; }
    case 's.reset': modal({ title: 'Reset demo data?', sub: 'Puts the example brokerage back the way it started. Your clicks in this browser are cleared.', actions: [{ label: 'Reset', cls: 'btn red', run: () => { Store.reset(); U.fSel = U.eSel = 'MB-2041'; toast('Demo data reset.'); return true; } }, { label: 'Cancel' }] }); break;
    case 's.export': download('4orm-broker-demo-data.json', Store.snapshot(), 'application/json'); toast('Data downloaded.'); break;
    /* builder */
    case 'b.arm': { const t = libItem(el.dataset.g, +el.dataset.i); U.bArmed = U.bArmed && U.bArmed.label === t.label ? null : t; render(); break; }
    case 'b.node': { const li = +el.dataset.li, j = +el.dataset.j; if (U.bArmed) { const t = U.bArmed; U.bArmed = null; if (t.type === 'plug') bInsertAt(li, j, t); else bInsertAt(li, j + 1, t); } else { U.bSel = id; render(); } break; }
    case 'b.slot': { const li = +el.dataset.li; if (U.bArmed && U.bArmed.type !== 'plug') { const t = U.bArmed; U.bArmed = null; bInsertAt(li, Store.s.process.lanes[li].steps.length, t); } else toast('Pick a block from the library first, then tap Drop here.'); break; }
    case 'b.remove': { const snap = Store.snapshot(); const name = A.procRemove(id); if (name) { U.bSel = 's2'; render(); toast('"' + name + '" removed', { undo: () => { Store.restore(snap); toast('Block restored.'); } }); } break; }
    case 'b.rename': renameModal(id); break;
    case 'b.map': U.mSel = id; go('map'); break;
    case 'b.gift': if (!A.procHas('Collect a gift letter')) { const nid = A.procInsert(1, 2, { kind: 'doc', name: 'Collect a gift letter', meta: "Agent, when the down payment isn't from savings" }); U.bSel = nid; render(); toast('Added to Intake.'); } break;
    case 'b.sign': if (!A.procHas('Principal sign-off over $1M')) { const nid = A.procInsert(2, Store.s.process.lanes[2].steps.length, { kind: 'appr', name: 'Principal sign-off over $1M', meta: Store.s.brokerage.principal }); U.bSel = nid; render(); toast('Added to Suitability.'); } break;
    case 'b.describeAdd': { const ta = document.querySelector('[data-f="b.describe"]'); const txt = ta ? ta.value.trim() : ''; if (!txt) { toast('Describe the rule first.'); break; } const kind = /sign|approv|over \$/i.test(txt) ? 'appr' : /letter|document|statement|proof|appraisal/i.test(txt) ? 'doc' : /check|verify|confirm/i.test(txt) ? 'check' : 'step'; const lane = kind === 'appr' ? 2 : 1; const nid = A.procInsert(lane, Store.s.process.lanes[lane].steps.length, { kind, name: txt.length > 42 ? txt.slice(0, 40) + '…' : txt, meta: kind === 'appr' ? Store.s.brokerage.principal : 'Agent' }); U.bSel = nid; render(); toast('Added as ' + BK[kind][1].toLowerCase() + ' block.'); break; }
    case 'b.reset': modal({ title: 'Reset to the base model?', sub: 'Your blocks come off the map. Required blocks are unchanged either way.', actions: [{ label: 'Reset', cls: 'btn red', run: () => { A.procReset(); U.bSel = 's2'; toast('Back to the 4orm base model.'); return true; } }, { label: 'Cancel' }] }); break;
    case 'b.publish': { const k = Store.s.process.changes.length; modal({ title: 'Publish to your agents?', sub: k + ' change' + (k === 1 ? '' : 's') + ' go live for every agent. New files follow the new process; open files keep theirs.', actions: [{ label: 'Publish', run: () => { A.procPublish(); toast('Published v' + Store.s.process.version + '. The control map carries your blocks.'); return true; } }, { label: 'Cancel' }] }); break; }
    case 'b.history': historyModal(); break;
    default: toast('Coming soon: ' + a);
  }
});

/* drag and drop (builder) */
document.addEventListener('dragstart', (e) => { const el = e.target.closest('[data-a="b.arm"]'); if (!el) return; U.bDrag = libItem(el.dataset.g, +el.dataset.i); try { e.dataTransfer.setData('text/plain', U.bDrag.label); e.dataTransfer.effectAllowed = 'copy'; } catch (x) { } });
document.addEventListener('dragend', () => { U.bDrag = null; U.bOver = null; if (U.route === 'builder') render(); });
document.addEventListener('dragover', (e) => { const t = e.target.closest('[data-drop]'); if (t && U.bDrag) { e.preventDefault(); const key = t.dataset.drop === 'slot' ? 'slot' + t.dataset.li : t.dataset.id; if (U.bOver !== key) { U.bOver = key; t.classList.add('over'); } } });
document.addEventListener('dragleave', (e) => { const t = e.target.closest && e.target.closest('[data-drop]'); if (t) t.classList.remove('over'); });
document.addEventListener('drop', (e) => { const t = e.target.closest('[data-drop]'); if (!t || !U.bDrag) return; e.preventDefault(); const tpl = U.bDrag; U.bDrag = null; U.bOver = null; const li = +t.dataset.li; if (t.dataset.drop === 'slot') { if (tpl.type !== 'plug') bInsertAt(li, Store.s.process.lanes[li].steps.length, tpl); else toast('Drop a connection onto a block, not a slot.'); } else { const j = +t.dataset.j; tpl.type === 'plug' ? bInsertAt(li, j, tpl) : bInsertAt(li, j + 1, tpl); } });

/* keyboard */
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === 'Escape') { closeSearch(); closeModal(); if (U.bArmed) { U.bArmed = null; render(); } }
});
window.addEventListener('hashchange', () => { const r = location.hash.replace(/^#\/?/, '') || 'overview'; if (r !== U.route) go(r, true); });

/* boot */
Store.load();
go((location.hash.replace(/^#\/?/, '') || 'overview'), true);

</script>
</body>
</html>
